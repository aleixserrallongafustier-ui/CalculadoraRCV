<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#115E73">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Calculadora RCV</title>
<style>
:root {
  --paper: #EDF1F0;
  --sheet: #FFFFFF;
  --ink: #16242B;
  --ink2: #46565E;
  --mute: #5A6A72;
  --line: #D3DCDE;
  color-scheme: light; /* S70 bloc 4 (H-01) */
  --focus-ring: #115E73; /* S70 bloc 4 (F-01, decisió 258, opció A): anell de focus = accent, 7,31:1 sobre blanc, 6,41:1 sobre #EAF1F7 */
  --ctl-line: #738790; /* S70 bloc 3 (A-01, decisió 253): vora de control ≥3:1 (3,75:1 sobre blanc; 3,29:1 sobre #EAF1F7) */
  --accent: #115E73;
  --accent-d: #0B4657;
  --soft: #E2EEF1;
  --warn-ink: #6B3A00;
  --warn-bg: #FFF1DA;
  --warn-line: #E6B96B;
  --bad-ink: #7A1F22;
  --bad-bg: #FBE4E4;
  --ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, "Noto Sans", sans-serif;
  --num: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.45 var(--ui);
}
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--sheet); box-shadow: 0 0 0 1px var(--line); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- Capçalera i passos ---------- */
.top { padding: calc(14px + env(safe-area-inset-top)) 18px 0; position: sticky; top: 0; background: var(--sheet); z-index: 5; border-bottom: 1px solid var(--line); }
.top:not(:has(.steps:not([hidden]))) { padding-bottom: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.brand .bt { min-width: 0; flex: 1; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.005em; line-height: 1.2; }
.brand p { margin: 0; font-size: 12.5px; color: var(--mute); }
.steps { list-style: none; display: flex; gap: 6px; margin: 12px 0 0; padding: 0; }
.steps li { flex: 1; min-width: 0; }
.steps button, .steps span.st { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0 0 8px; cursor: default; }
.steps .bar { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-bottom: 6px; }
.steps .lbl { display: block; font-size: 12.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps .done .bar { background: var(--accent); }
.steps .done { cursor: pointer; }
.steps .done .lbl { color: var(--ink2); }
.steps .cur .bar { background: var(--accent); height: 6px; margin-top: -1px; }
.steps .cur .lbl { color: var(--ink); font-weight: 650; }
.steps .skip .bar { background: repeating-linear-gradient(90deg, var(--line) 0 5px, transparent 5px 8px); }
.steps .skip .lbl { text-decoration: line-through; }

/* ---------- Contingut ---------- */
main { flex: 1; padding: 20px 18px 28px; }
h2 { margin: 0 0 4px; font-size: 22px; line-height: 1.2; font-weight: 650; letter-spacing: -.01em; }
.lead { margin: 0 0 18px; color: var(--ink2); font-size: 15px; max-width: 62ch; }
h3 { margin: 0 0 10px; font-size: 15.5px; font-weight: 650; }
.sec { border-top: 1px solid var(--line); padding: 18px 0; }
.sec:first-of-type { border-top: 0; padding-top: 4px; }
.hint { margin: 6px 0 0; font-size: 13px; color: var(--mute); }
.hint.err { color: var(--bad-ink); font-weight: 600; }
.hint.warn { color: var(--warn-ink); }

/* Camps numèrics: lliscador + caixa */
.fld { margin: 0 0 20px; }
.fld > label, .lab { display: block; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.fld .opt { font-weight: 400; color: var(--mute); font-size: 13px; }
.ctl { display: flex; align-items: center; gap: 14px; }
.num { display: flex; align-items: baseline; gap: 6px; flex: none; border: 1.5px solid var(--ctl-line); border-radius: 8px; padding: 0 10px; background: #fff; min-height: 46px; }
.num:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px #CFE4EA; }
.num input { width: 62px; border: 0; background: none; text-align: right; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 10px 0; outline: none; }
.num .u { font-size: 12.5px; color: var(--mute); min-width: 38px; }
.fld.bad .num { border-color: #B3363A; }
input[type=range] { flex: 1; min-width: 0; height: 40px; background: none; -webkit-appearance: none; appearance: none; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--accent); margin-top: -10px; }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--accent); }
.fld.untouched input[type=range]::-webkit-slider-thumb { background: #fff; box-shadow: 0 0 0 1.5px #8B9DA4; }
.fld.untouched input[type=range]::-moz-range-thumb { background: #fff; box-shadow: 0 0 0 1.5px #8B9DA4; }
.fld.plain .num { width: 100%; max-width: 220px; }
.fld.plain .num input { flex: 1; width: auto; }

/* Controls segmentats (radio natius) */
.seg { display: flex; border: 1.5px solid var(--ctl-line); border-radius: 10px; overflow: hidden; background: #fff; }
.seg label { flex: 1; position: relative; text-align: center; margin: 0; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
.seg span { display: block; padding: 11px 8px; font-weight: 600; font-size: 15px; min-height: 46px; border-left: 1.5px solid #C9D5D8; }
.seg label:first-child span { border-left: 0; }
.seg input:checked + span { background: var(--accent); color: #fff; }
.seg input:focus-visible + span { outline: 3px solid var(--focus-ring); outline-offset: -3px; }
.seg input:checked:focus-visible + span { outline-color: #fff; } /* fons accent: anell blanc (7,31:1) */
.seg.sm span { padding: 8px 6px; font-size: 13.5px; min-height: 40px; }

/* Condicions (caselles) */
.cond { padding: 12px 0; border-top: 1px solid var(--line); }
.cond:first-of-type { border-top: 0; padding-top: 0; }
.chk { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; margin: 0; }
.chk input { position: absolute; opacity: 0; width: 24px; height: 24px; margin: 0; cursor: pointer; }
.chk .box { flex: none; width: 24px; height: 24px; border: 2px solid #8B9DA4; border-radius: 6px; background: #fff; display: grid; place-items: center; margin-top: 1px; }
.chk input:checked + .box { background: var(--accent); border-color: var(--accent); }
.chk input:checked + .box::after { content: ""; width: 6px; height: 12px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.chk input:focus-visible + .box { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.chk input:disabled + .box { opacity: .75; }
.chk .t { font-weight: 600; font-size: 15.5px; line-height: 1.3; }
.chk .d { display: block; font-weight: 400; font-size: 13px; color: var(--mute); margin-top: 2px; }
.sub { margin: 12px 0 2px 36px; padding-left: 14px; border-left: 3px solid var(--soft); }
.sub .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
.mini { display: block; }
.mini > span { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
.mini input[type=text], .mini select { width: 130px; border: 1.5px solid var(--ctl-line); border-radius: 8px; padding: 9px 10px; min-height: 42px; background: #fff; font-size: 16px; }
.mini input:focus, .mini select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px #CFE4EA; }

/* Avisos */
.note { border-radius: 10px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 0; background: var(--soft); color: var(--ink); }
.note svg { flex: none; margin-top: 2px; }
.note > div { min-width: 0; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); box-shadow: inset 0 0 0 1.5px var(--warn-line); }
.note.bad { background: var(--bad-bg); color: var(--bad-ink); }
.note b { font-weight: 650; }
.note p { margin: 0; }
.note p + p { margin-top: 6px; }
.note ul { margin: 4px 0 0; padding-left: 18px; }
.note ul.tightl { margin: 0; }
.note ul.tightl li + li { margin-top: 6px; }

/* Categoria (xip) */
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; border-radius: 6px; font-weight: 650; font-size: 15px; background: var(--t); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--c); }
.chip svg { flex: none; }

/* Pas 2: països */
details.country { border: 1.5px solid var(--ctl-line); border-radius: 10px; padding: 0 14px; margin: 4px 0 0; }
details.country summary { cursor: pointer; padding: 13px 0; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
details.country summary::-webkit-details-marker { display: none; }
details.country summary .chev { color: var(--mute); font-weight: 400; font-size: 13px; }
details.country[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 12px; }
details.country .body { padding-bottom: 14px; }
.country input[type=text] { width: 100%; border: 1.5px solid var(--ctl-line); border-radius: 8px; padding: 10px 12px; font-size: 16px; min-height: 46px; }
.country input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px #CFE4EA; }
.link { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 8px 0; cursor: pointer; font-size: 14px; }

/* ---------- Resultat ---------- */
.who { margin: 0 0 6px; color: var(--ink2); font-size: 14.5px; }
.gauge { display: block; width: 100%; max-width: 420px; margin: 4px auto 0; height: auto; overflow: visible; }
.gauge .pct { font-family: var(--num); font-size: 54px; font-weight: 600; fill: var(--ink); font-variant-numeric: lining-nums; }
.gauge .sub { font-size: 12.5px; fill: var(--mute); }
.gauge .tick { font-size: 12.5px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
.gcap { text-align: center; margin: -2px 0 0; font-size: 13.5px; color: var(--mute); }
.pure-line { display: flex; justify-content: center; margin: 12px 0 4px; }
.bands { display: flex; gap: 6px; margin: 14px 0 0; }
.bands > div { flex: 1; border-radius: 8px; padding: 8px 8px 8px 10px; font-size: 12.5px; line-height: 1.3; background: var(--t); position: relative; }
.bands > div.on { box-shadow: inset 0 0 0 2px var(--c); }
.bands b { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.bands .rg { color: var(--ink2); font-variant-numeric: tabular-nums; }
.kv { margin: 0; display: grid; grid-template-columns: 1fr; gap: 0; }
.kv > div { padding: 12px 0; border-top: 1px solid var(--line); }
.kv > div:first-child { border-top: 0; padding-top: 4px; }
.kv dt { font-size: 13.5px; color: var(--mute); margin: 0 0 2px; }
.kv dd { margin: 0; font-size: 17px; font-weight: 650; }
.kv dd small { display: block; font-weight: 400; font-size: 13px; color: var(--mute); margin-top: 2px; }
.big { font-family: var(--num); font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.trace { margin: 8px 0 0; padding-left: 18px; font-size: 14px; color: var(--ink2); }
.legend { margin-top: 10px; }
.legend summary { cursor: pointer; font-size: 14px; color: var(--accent); padding: 8px 0; }
table.th { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
table.th th, table.th td { text-align: left; padding: 7px 6px; border-top: 1px solid var(--line); }
table.th thead th { color: var(--mute); font-weight: 600; border-top: 0; }
table.th tr.on td, table.th tr.on th { background: var(--soft); font-weight: 650; }
.override { margin-top: 10px; }
.override .lab { font-size: 13.5px; font-weight: 600; color: var(--ink2); }
.ldlin { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.ldlin .num input { width: 70px; }
.srcs { font-size: 13px; color: var(--ink2); }
.srcs ul { padding-left: 18px; margin: 8px 0; }
.srcs li { margin: 3px 0; }
.fine { font-size: 12.5px; color: var(--mute); margin-top: 14px; }

/* ---------- Barra inferior ---------- */
.nav { position: sticky; bottom: 0; background: var(--sheet); border-top: 1px solid var(--line); padding: 10px 18px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: center; z-index: 5; }
.nav .msg { flex: 1; font-size: 12.5px; color: var(--mute); line-height: 1.3; min-width: 0; }
.nav .msg.strong { font-size: 14px; color: var(--ink); text-align: center; }
.btn { min-height: 48px; padding: 0 20px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--accent); color: #fff; font-weight: 650; font-size: 16px; cursor: pointer; }
@media (hover: hover) { .btn:hover { background: var(--accent-d); } }
.btn.ghost { background: #fff; color: var(--accent); }
@media (hover: hover) { .btn.ghost:hover { background: var(--soft); } }
.btn:disabled { background: #C9D5D8; border-color: #C9D5D8; color: #fff; cursor: not-allowed; }
.nav .btn.main { margin-left: auto; }
.btn.block { width: 100%; }

@media (min-width: 600px) {
  body { padding: 24px 0; }
  #app { border-radius: 14px; min-height: calc(100vh - 48px); overflow: clip; }
}
@media (max-width: 380px) {
  .bands { flex-direction: column; }
  .gauge .pct { font-size: 48px; }
}
@media (prefers-reduced-motion: no-preference) {
  .steps .bar { transition: background-color .2s; }
}
@media print {
  .nav, .steps, .top, .tabs, .strip, .sheet-bg, .toast { display: none; }
  #app { box-shadow: none; }
}

/* Colors per categoria (classes, perquè la CSP no permet estils en línia) */
.lv0 { --c: #2F8A66; --t: #DDF0E7; }
.lv1 { --c: #CC7410; --t: #FBE8CC; }
.lv2 { --c: #C4383A; --t: #F7D9D9; }
.lv3 { --c: #6E2150; --t: #EBD6E3; }
.gap { height: 10px; }
.hint.tight { margin: -4px 0 12px; }
.hint.tight0 { margin: 0 0 8px; }
.hint.flush { margin: 0; }
.fld.flush { margin: 0; }
label.lab.flush { margin: 0; }
.fld.plain .num { width: auto; max-width: none; }
.fld.plain .num input { flex: none; width: 90px; }
.num input::placeholder { color: #9AA9AF; font-weight: 400; }

/* ---------- Disseny per a PC / tauleta ---------- */
@media (min-width: 900px) {
  #app { max-width: 1040px; }
  .top { padding: 18px 40px 0; }
  .top:not(:has(.steps:not([hidden]))) { padding-bottom: 14px; }
  .brand h1 { font-size: 19px; }
  .steps { max-width: 560px; }
  main { padding: 28px 40px 36px; }
  .nav { padding: 12px 40px calc(12px + env(safe-area-inset-bottom)); }
  h2 { font-size: 26px; }
  .lead { max-width: 80ch; }
  .sec:has(> .fld .ctl) { display: grid; grid-template-columns: 1fr 1fr; column-gap: 48px; align-items: start; }
  .sec:has(> .fld .ctl) > .fld { margin-bottom: 22px; }
  .sec:has(input[data-mod]) { display: grid; grid-template-columns: 1fr 1fr; column-gap: 48px; align-items: start; }
  .sec:has(input[data-mod]) > h3, .sec:has(input[data-mod]) > .hint { grid-column: 1 / -1; }
  .sec:has(input[data-mod]) > .cond:nth-of-type(2) { border-top: 0; padding-top: 0; }
  .kv { grid-template-columns: repeat(3, 1fr); column-gap: 28px; }
  .kv > div { border-top: 0; border-left: 1px solid var(--line); padding: 4px 0 4px 20px; }
  .kv > div:first-child { border-left: 0; padding-left: 0; }
  .gauge { max-width: 460px; }
  .bands { max-width: 640px; margin-left: auto; margin-right: auto; }
  .note { max-width: 860px; }
}
@media (min-width: 1200px) {
  #app { max-width: 1120px; }
}

/* ---------- Passos curts a pantalles estretes ---------- */
.steps .ls { display: none; }
@media (max-width: 440px) {
  .steps { gap: 4px; }
  .steps .lbl { font-size: 12px; }
  .steps .lf { display: none; }
  .steps .ls { display: inline; }
  .top { padding-left: 14px; padding-right: 14px; }
  .brand p { display: none; }
}
.gap-h { margin-top: 18px; }
.seg.wrap { flex-wrap: wrap; }
.seg.wrap label { flex: 1 1 45%; }
.seg.wrap label:nth-child(odd) span { border-left: 0; }
.seg.wrap label:nth-child(n+3) span { border-top: 1.5px solid #C9D5D8; }
.sec.tight { padding-top: 14px; padding-bottom: 14px; }
.tag { display: inline-block; font-size: 12px; font-weight: 650; padding: 1px 8px; border-radius: 5px; background: var(--soft); color: var(--accent-d); }
.tag.inj { background: #EFE7F6; color: #4B2A73; }
.tag.rsv { background: var(--warn-bg); color: var(--warn-ink); box-shadow: inset 0 0 0 1px var(--warn-line); }
table.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
table.cmp th, table.cmp td { text-align: left; vertical-align: top; padding: 6px 6px; border-top: 1px solid var(--line); }
table.cmp thead th { color: var(--mute); font-weight: 600; border-top: 0; }
table.cmp td.y { font-weight: 650; }
.t9 .yes { font-weight: 650; color: var(--ink); }
.t9 .no { color: var(--mute); }
.fundl { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink2); }
.fundl li { margin: 5px 0; }
.tableWrap { overflow-x: auto; }

/* ---------- Sessió 10: inici, targetes, teràpia compacta, DLCN ---------- */

/* Targetes: tractament actual (1) i pautes (2) clarament separades */
.card { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 14px 6px; margin: 14px 0 0; background: #fff; }
.card > h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 16px; }
.card .nb { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-grid; place-items: center; font-size: 14px; font-weight: 700; }
.card.cur { background: #EAF1F7; border-color: #8FAFC8; border-left: 6px solid #3F6C94; }
.card.prop { background: #E8F5EC; border-color: #9BCDB2; border-left: 6px solid #1F7050; }
.card.cur .nb { background: #3F6C94; }
.card.prop .nb { background: #1F7050; }
.card .fld { margin-bottom: 14px; }
.card .cond:first-of-type { padding-top: 0; }
.card .cond { padding: 10px 0; }
.card .cond:last-child { padding-bottom: 12px; }
.card .legend { margin-top: 2px; }
.card.res { background: #F6FAFB; }
.card.dir .sub { margin-left: 4px; }
.ldl-row .num input { width: 80px; }
.goalbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 4px 0 0; font-size: 14.5px; color: var(--ink2); }
.goalbar b { color: var(--ink); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.pill { position: relative; margin: 0; }
.pill input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.pill span { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; min-height: 42px; border: 1.5px solid var(--ctl-line); border-radius: 999px; background: #fff; font-weight: 600; font-size: 14.5px; }
.pill input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
.pill input:checked + span::before { content: "✓"; font-weight: 700; }
.pill input:focus-visible + span { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.cursum { margin: 0 0 8px; padding: 10px 12px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1.5px #A9CBD6; font-size: 14.5px; }
.legend.more { margin-top: 4px; }
.legend.more > summary { font-weight: 600; }
.need { margin: 0 0 6px; font-size: 15px; }
.need .nd { color: var(--ink2); font-size: 14px; }
.tierd { border: 1.5px solid var(--line); border-radius: 10px; margin: 8px 0; background: #fff; }
.tierd > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 12px; font-weight: 650; font-size: 14.5px; min-height: 46px; }
.tierd > summary::-webkit-details-marker { display: none; }
.tierd > summary::after { content: "▾"; flex: none; color: var(--accent); margin-left: 2px; }
.tierd[open] > summary::after { content: "▴"; }
.tierd > summary .tn { flex: 1; min-width: 0; }
.tierd > summary .rr { font-weight: 400; color: var(--mute); font-size: 12.5px; }
.tierd > summary .tc { flex: none; font-weight: 600; font-size: 12.5px; color: var(--accent-d); background: var(--soft); border-radius: 999px; padding: 2px 10px; }
.tierd[open] > summary { border-bottom: 1px solid var(--line); }
.tierd .rxl { padding: 10px; }
.rxl { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rx { border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 11px; background: #fff; }
.rx-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.rx-n { font-weight: 650; font-size: 15px; line-height: 1.3; }
.rx-r { flex: none; font-family: var(--num); font-size: 21px; font-weight: 600; font-variant-numeric: lining-nums; }
.rx-a { margin: 2px 0 0; font-size: 13px; color: var(--ink2); }
.rx-m { margin: 5px 0 0; display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12.5px; color: var(--mute); font-variant-numeric: tabular-nums; }
.rx-m b { color: var(--ink); font-weight: 650; }
details.inner { margin-top: 6px; }
details.inner > summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--accent); }
details.inner ul { margin: 6px 0 0; padding-left: 18px; }

/* DLCN */
.pts { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: var(--soft); color: var(--accent-d); font-weight: 650; font-size: 12px; white-space: nowrap; }
.dl-score { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 8px; }
.dl-score .big { font-size: 40px; line-height: 1; }
.dl-score .pu { color: var(--ink2); font-size: 14px; }
.dl-parts { list-style: none; margin: 4px 0 8px; padding: 0; display: grid; grid-template-columns: 1fr; font-size: 14px; }
.dl-parts li { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); }
.dl-parts li:first-child { border-top: 0; }
.fhbox { margin: 14px 0 0; }

@media (min-width: 900px) {
  .rxl { grid-template-columns: 1fr 1fr; }

  .card { padding: 18px 20px 8px; }

}
