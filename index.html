  var NOTE_INC = "Cap de les guies recollides grada una recomanació per a l’inclisiran. L’actualització ESC/EAS 2025 (p. 4368) el descriu com a possible alternativa als anticossos (≈50 % de reducció de LDL als assaigs de fase III), amb dos assaigs de resultats CV encara en curs que preveia comunicar el 2026 i el 2027; en la seva Taula 2 el grup de teràpies no estatínica amb benefici CV demostrat només inclou ezetimiba, anti-PCSK9 i àcid bempèdic (p. 4369). L’ESC 2026 (p. 48, §7.1.2.2) diu només que l’inclisiran i l’àcid bempèdic «es poden utilitzar» en la MRC lleu o moderada, sense classe; les seves recomanacions d’«inhibidor de la PCSK9» (Taules 20 i 23) citen l’evidència de l’evolocumab i l’alirocumab i s’hi han recollit com a anticossos.";
  var DISC = [{"id":"sca-pcsk9","t":"Anti-PCSK9 en el SCA","refs":["e19-20","e19-22","xu-05"],"x":"ESC/EAS 2019 el recomana (I B) si als 4–6 setmanes no s’assoleix l’objectiu amb estatina + ezetimiba, i el considera precoç (IIa C) durant l’ingrés. La XULA 2022 fixa un altre llindar (LDL >100 mg/dL en pacients ja tractats) i una altra classe (IIb C)."},{"id":"intol-pcsk9","t":"Intolerància a estatines i anti-PCSK9","refs":["e19-06","e19-07","e23-06","e23-08","e23-09","xu-08","xu-12","e21-10","e21-11"],"x":"ESC/EAS 2019 dona IIa C a l’ezetimiba i IIb C a afegir-hi un anti-PCSK9. La XULA 2022 agrupa ezetimiba, segrestadors d’àcids biliars i anti-PCSK9 en una sola recomanació IIa C. L’ESC 2023 (diabetis) dona IIa C a l’ezetimiba i IIa B a afegir-hi un anti-PCSK9; però la seva fila I A de l’anti-PCSK9 inclou també «els pacients amb intolerància a les estatines» (p. 4077): la guia no és coherent amb ella mateixa. L’ESC 2021 (p. e51) dona IIa B a l’ezetimiba (l’ESC/EAS 2019, IIa C) i IIb C a l’anti-PCSK9 (igual que l’ESC/EAS 2019)."},{"id":"dm1","t":"DM1 de risc alt o molt alt","refs":["e19-13","xu-09"],"x":"ESC/EAS 2019: estatines, I A. XULA 2022: tractament hipolipemiant d’alta o molt alta intensitat, IIa C."},{"id":"dialisi","t":"Diàlisi sense malaltia CV","refs":["e19-29","xu-15","e21-23","e21-22","e26-04","e26-06"],"x":"Sense malaltia CV, l’ESC/EAS 2019 (III A), l’ESC 2021 (III A, p. e53) i la XULA 2022 (III C) desaconsellen iniciar el tractament; l’ESC 2026 (p. 27) diu que es pot considerar una pauta d’estatines en diàlisi amb trasplantament previst (IIb C) i, amb antecedent de MCVA, també (IIb C). Continuar el tractament en començar la diàlisi: IIa C a l’ESC/EAS 2019, l’ESC 2021 i la XULA 2022, però IIb C a l’ESC 2026. El nivell A i el C de la classe III també difereixen entre guies."},{"id":"gent-gran","t":"Prevenció primària a partir dels 75 anys","refs":["e19-11","xu-17","e21-15"],"x":"ESC/EAS 2019: es pot considerar iniciar estatines en >75 anys amb risc alt o superior (IIb B). XULA 2022: amb ≥75 anys i SCORE2-OP >7,5 % (IIa C). L’ESC/EAS 2019 és anterior a SCORE2-OP. L’ESC 2021 (p. e52) fixa el límit en 70 anys en lloc de 75 i diu que n’ha modificat la classe i el nivell entre els 70 i els 75 anys: es pot considerar iniciar estatines en prevenció primària a partir dels 70 anys amb risc alt o superior (IIb B)."},{"id":"sca-combo","t":"Estatina + ezetimiba des de l’ingrés per SCA","refs":["e25-05","se-03"],"x":"ESC/EAS 2025: es pot considerar en pacients sense tractament previ que no arribarien a l’objectiu amb estatina sola (IIa B). SEA 2026 la qualifica d’«obligatòria» en aquest supòsit, sense classe ni nivell."},{"id":"combo-fixa","t":"Combinació fixa estatina + ezetimiba","refs":["xu-07"],"x":"Només la XULA 2022 la grada (IIa C, per millorar l’adherència). ESC/EAS 2019 i 2025 no tenen una recomanació equivalent a les taules revisades."},{"id":"bempedic","t":"Àcid bempèdic","refs":["e25-02","e25-03","xu-21","xu-22","se-01"],"x":"Només l’ESC/EAS 2025 el grada (I B si no es poden prendre estatines; IIa C afegit a estatina amb o sense ezetimiba). XULA 2022 i SEA 2026 el citen com a opció, sense classe ni nivell."},{"id":"prim-vh","t":"Prevenció primària de risc molt alt sense HF","refs":["e19-03","e23-06","xu-04","xu-06","e21-07","e21-03"],"x":"ESC/EAS 2019 considera l’anti-PCSK9 (IIb C). El Box 4 de la XULA 2022 només grada la prevenció secundària i la HF; la Taula 9 només el contempla en prevenció primària amb MRC ≥3b i diabetis. L’ESC 2023 (només diabetis tipus 2) el recomana amb I A en risc molt alt (que hi inclou lesió d’òrgan diana greu sense MCVA) si el LDL queda per sobre de l’objectiu malgrat estatina màxima tolerada + ezetimiba (p. 4077). L’ESC 2021 (p. e51) manté IIb C per a l’anti-PCSK9 en prevenció primària de risc molt alt sense HF."},{"id":"obj-prim","t":"Objectiu de LDL en prevenció primària (<55 i <70 mg/dL)","refs":["e21-03","e21-04","e19-01","xu-01"],"x":"Als pacients aparentment sans, l’ESC 2021 (p. e51) dona IIa C a l’objectiu <55 mg/dL amb reducció ≥50 % en risc molt alt i IIa C a <70 mg/dL amb reducció ≥50 % en risc alt, per a menors de 70 anys; la mateixa guia explica (p. e50) que la classe és menor que a la guia de dislipèmies perquè la decisió va ser menys unànime. L’ESC/EAS 2019 (p. 403.e21) i la XULA 2022 (Box 2) donen I C a <55 en prevenció primària de risc molt alt i I A a <70 en risc alt. L’ESC 2021 dona I A a <55 en prevenció secundària, igual que l’ESC/EAS 2019."},{"id":"dm2-obj","t":"Objectiu de LDL <55 mg/dL en la diabetis tipus 2 de risc molt alt","refs":["e21-17","e23-03"],"x":"L’ESC 2021 (p. e53) el recomana amb I A (DM2 amb MCVA establerta o lesió d’òrgan diana greu) i l’ESC 2023 de diabetis (p. 4077) amb I B. L’ESC 2023 defineix el risc molt alt de la DM2 també amb SCORE2-Diabetes ≥20 % (Taula 7, p. 4060). Per a <70 mg/dL en risc alt les dues donen I A."},{"id":"epa-class","t":"Icosapent etil","refs":["e19-33","e21-25","e25-08","e23-10","e26-12","xu-24","se-07","se-08"],"x":"ESC/EAS 2019 i 2025: IIa B (risc alt o molt alt, TG 135–499 mg/dL malgrat l’estatina). ESC 2021 (p. e52): IIb B, per a la mateixa població i els mateixos TG (>135 mg/dL): és la discrepància més clara entre guies de l’ESC. ESC 2023 (diabetis): IIb B (TG 150–499 mg/dL). XULA 2022: classe I, nivell B, però amb el redactat «es pot considerar» (propi d’una IIb), i el seu text diu que l’icosapent no és comercialitzat a Espanya, cosa ja obsoleta. SEA 2026: no gradua; cita la IIa de les guies del 2025. ESC 2026 (taula 20, p. 50): IIb B1, només en síndrome coronària crònica amb MRC (FG ≥30) i LDL >40 mg/dL. A banda, l’acord CFT-SISCAT (21/12/2023) el classifica com a categoria D (sense valor terapèutic afegit)."},{"id":"fib-class","t":"Fenofibrat i bezafibrat","refs":["e19-34","e19-35","e21-24","xu-23","se-06"],"x":"ESC/EAS 2019: IIb B en prevenció primària i IIb C en risc alt, amb LDL a l’objectiu i TG >200 mg/dL. ESC 2021 (p. e52): IIb B (estatina, LDL a l’objectiu, TG >200 mg/dL). XULA 2022 (Box 7): IIb B, TG >200 mg/dL, també en prevenció primària; però el seu text exigeix TG >200 i HDL <35 mg/dL. L’ESC/EAS 2025 no té cap fila de fibrats: en el text només «dona suport» al IIb del 2019 i hi afegeix que reduir els TG amb fibrats no ha demostrat reduir el risc, i que el pemafibrat (PROMINENT) no el va reduir i va augmentar l’apoB. L’ESC 2023 i l’ESC 2026 no en recomanen cap. SEA 2026: no gradua; cita el IIb i el PROMINENT. El gemfibrozil no és a cap recomanació codificada (els assaigs HHS i VA-HIT són d’abans de l’ús actual d’estatines): la XULA 2022 el contraindica amb estatines i l’acord CFT-SISCAT el prioritza només en la hipertrigliceridèmia greu aïllada."}];

    {"id":"xu-21","g":"xu","t":"Text · MRC (§5.4.2)","p":"36","c":null,"l":null,"s":"ckd","d":["ab","ba"],"x":"MRC, objectiu de LDL <55 mg/dL: si no s’assoleix amb tractament convencional optimitzat, hi ha indicació d’anti-PCSK9 amb LDL >100 mg/dL (>70 amb factors agreujants; la guia hi anota «no finançat»). Si no es pot disposar d’anti-PCSK9, es pot considerar la triple teràpia oral estatina + ezetimiba + àcid bempèdic (també «no finançat»)."},

    return { out: out, idx: idx, g: M.goalFor(idx, S.ldl, { moderateByClinical: apModerate(out, idx) }), direct: false };
  }

  /* ---------- Estatina actual: fàrmac i dosi (sessió 11) ----------
   * statinDrug: 'none' (cap) | id del catàleg | 'class' (només se sap la intensitat: baixa/moderada/alta).
   * Amb fàrmac + dosi, la classe d'intensitat depèn de l'escala triada (classificació SEA 2026; atorvastatina 40 mg = moderada a totes les escales, decisió 19). */
  function statinIsDrug() { var T = S.tx; return T.statinDrug !== 'none' && T.statinDrug !== 'class' && T.statinDose !== ''; }
  function effStatin(scale) {
    var T = S.tx;
    if (statinIsDrug()) return D.statinClass(T.statinDrug, +T.statinDose, scale);
    if (T.statinDrug === 'class') return T.statin;
    return 'none';
  }
  function hasTx() { var T = S.tx; return effStatin(T.scale) !== 'none' || T.ez || T.ba || T.pcsk9 !== 'none'; }
  /* Situació clínica per al finançament de l'iPCSK9 (punt 77). Si el clínic no ho ha tocat, es parteix del pas 1 (malaltia CV establerta / HF). */
  function mcvEff() { var T = S.tx; return T.mcv != null ? T.mcv : !!S.ascvd; }
  function hfheEff() { var T = S.tx; return T.hfhe != null ? T.hfhe : !!S.fh; }
  function sdHint() {
    var T = S.tx;
    if (T.statinDrug === 'none') return { t: '', c: '' };
    if (T.statinDrug === 'class') return { t: T.statin === 'none' ? 'Tria la intensitat de l’estatina.' : 'Només se sap la intensitat: l’eficàcia és la de la classe.', c: '' };
    if (T.statinDose === '') return { t: 'Tria la dosi: sense dosi no es té en compte l’estatina.', c: 'warn' };
    var dis = D.statinDiscrepancy(T.statinDrug, +T.statinDose), cls = dis[T.scale];
    var t = D.describeStatin(T.statinDrug, +T.statinDose) + ': intensitat ' + D.CLASS_CA[cls] + ' segons ' + D.statinCite(T.statinDrug, +T.statinDose, T.scale) + '.';
    if (dis.differs) t += ' Discrepància entre guies: SEA 2026 = ' + D.CLASS_CA[dis.SEA_2026] + '; XULA 2022 = ' + D.CLASS_CA[dis.XULA_2022] + '. S’aplica l’escala triada.';
    return { t: t, c: dis.differs ? 'warn' : '' };
  }
  /* S39 (decisió 113): el desplegable de l'estatina i el de la dosi ja no es tornen a crear ni a enfocar en canviar-los (a alguns navegadors mòbils això reobria el selector una segona vegada). Només es refà el que depèn del canvi: dosi, intensitat i avís. */
  function statinDoseHTML() {
    var T = S.tx;
    if (T.statinDrug === 'none' || T.statinDrug === 'class') return '';
    var st = null; D.STATINS.forEach(function (x) { if (x.id === T.statinDrug) st = x; });
    function opt(v, txt, cur) { return '<option value="' + v + '"' + (String(cur) === String(v) ? ' selected' : '') + '>' + esc(txt) + '</option>'; }
    return '<label class="sdc dose ' + (T.statinDose === '' ? 'warn' : 'on') + '" id="sdc-dose"><span class="sdc-f" id="sdf-dose">' + esc(sdDoseFace()) + '</span><select id="t-sdose" data-sd="dose" aria-label="Dosi de ' + esc(st.name.toLowerCase()) + '">' + opt('', 'Dosi…', T.statinDose) +
      st.doses.map(function (d) {
        var dis = D.statinDiscrepancy(st.id, d);
        return opt(d, d + ' mg · ' + D.CLASS_CA[dis[T.scale]] + (dis.differs ? ' *' : ''), T.statinDose);
      }).join('') + '</select></label>';
  }
  /* S46 (petició 332): l'estatina és una targeta com les altres (nom curt); el desplegable natiu hi és a sobre, transparent, i s'obre en tocar-la. */
  var STATIN_SHORT = { atorvastatin: 'Atorva', rosuvastatin: 'Rosuva', simvastatin: 'Simva', pravastatin: 'Prava', lovastatin: 'Lova', fluvastatin: 'Fluva', pitavastatin: 'Pitava' };
  function sdDrugFace() { var T = S.tx; return T.statinDrug === 'none' ? 'Estatina' : T.statinDrug === 'class' ? 'Altra estatina' : statinFullName(T.statinDrug); }
  /* S47 (feedback d'Aleix): a les targetes, el nom complet; el curt (STATIN_SHORT) només a la frase «Actual: …». */
  function statinFullName(id) { var r = id; try { D.STATINS.forEach(function (st) { if (st.id === id) r = st.name; }); } catch (e) { r = id; } return r; }
  function sdDoseFace() { var T = S.tx; return T.statinDose === '' ? 'Dosi…' : T.statinDose + ' mg'; }
  function sdFaces() {
    var T = S.tx, f = $('sdf-drug'), c = $('sdc-drug');
    if (f) f.textContent = sdDrugFace(); if (c) c.className = 'sdc' + (T.statinDrug === 'none' ? '' : ' on');
    f = $('sdf-dose'); c = $('sdc-dose');
    if (f) f.textContent = sdDoseFace(); if (c) c.className = 'sdc dose ' + (T.statinDose === '' ? 'warn' : 'on');
  }
  function statinClsHTML() {
    var T = S.tx;
    return T.statinDrug === 'class' ? '<div class="sd-cls"><span class="lab" id="lab-tx-statin">Intensitat</span>' + seg('tx-statin', [['low', 'Baixa'], ['moderate', 'Moderada'], ['high', 'Alta']], T.statin, 'sm', 'data-tx') + '</div>' : '';
  }
  function statinCtlHTML() {
    var T = S.tx, h = '<span class="lab" id="lab-sd">Estatina</span><div class="sd-row"><label class="sdc' + (T.statinDrug === 'none' ? '' : ' on') + '" id="sdc-drug"><span class="sdc-f" id="sdf-drug">' + esc(sdDrugFace()) + '</span><select id="t-sd" data-sd="drug" aria-labelledby="lab-sd">';
    function opt(v, txt, cur) { return '<option value="' + v + '"' + (String(cur) === String(v) ? ' selected' : '') + '>' + esc(txt) + '</option>'; }
    h += opt('none', 'Sense estatina', T.statinDrug);

    h += opt('class', 'Altra o només sé la intensitat', T.statinDrug) + '</select></label><span id="sd-dose-wrap" class="sd-dw">' + statinDoseHTML() + '</span></div>';

  /* Taula de classes d'intensitat per fàrmac i dosi (les dues escales; el que difereix es mostra explícitament) */

  }

  /* S46 (petició 331): LDL basal estimat (placeholder en negreta i cursiva + «calculat, no real»); mai es desa com a valor real (decisió 88). */
  var BASE_NOTE = 'LDL calculat segons fàrmac, no real';
  function baseEstPh() {

  function lipInput(id, tk, value, ph, suffix) {

  /* MRC: dades disponibles per a la nota informativa (punt 56) */
  function ckdInfo() {

  function dirNum(k, ph) { return '<input type="text" inputmode="decimal" autocomplete="off" data-dn="' + k + '" value="' + (S.dir[k] == null ? '' : String(S.dir[k]).replace('.', ',')) + '" placeholder="' + ph + '">'; }
  function directCardHTML() {

  /* S45 (decisió 158): la malaltia renal crònica és a «Situació clínica» de Tractament (a l'entrada directa; amb càlcul de risc ve de Pacient) */
  function sitCkdHTML() {

  function directCheckHTML() {

    var ex; try { ex = M.evaluateExclusions({ sex: 'M', age: 55, ckd: { egfr: d.egfr, acr: d.acr } }); } catch (e) { return ''; }

    return note('warn', '<p><b>La categoria triada pot ser baixa per a la MRC.</b> El càlcul de risc situaria el pacient en «' + esc(LABELS[ex.level]) + '» (' + esc(ex.reasons.join('; ')) + '). Has triat «' + esc(LABELS[d.idx]) + '».</p>' +
      ex.notes.map(function (n) { return '<p>' + esc(n) + '</p>'; }).join(''));

  function ovrBoxHTML(ctx) {

      [0, 1, 2].map(function (i) { return '<label><input type="radio" name="override" value="' + i + '" data-s="override"' + (i === ctx.idx ? ' checked' : '') + '><span>' + LABELS[i] + '</span></label>'; }).join('') + '</div></div></details>';
  }
  /* Rajoles d'objectius (F2, decisió 49): LDL, c-no-HDL i apoB junts i només a Teràpia. La reducció necessària es mostra una sola vegada, a la capçalera de les pautes. */
  function goalbarHTML(ctx, res) {
    /* S47 (feedback d'Aleix): sense la fila «Reducció mínima …»; la reducció és a la rajola del LDL (una dada = un lloc).
     * S58: amb res (Resultat mòbil) la rajola mostra la reducció necessària per al LDL entrat (o la mínima de la guia sense LDL) i no hi ha l'edició de la categoria. */
    var rp = ctx.g.requiredReductionPct, gmin = res && rp != null ? (rp > 0 ? '<small class="gmin">reducció ≥ ' + rp + ' %</small>' : '<small class="gmin">no cal reducció</small>') : (ctx.g.minReduction ? '<small class="gmin">reducció ≥ ' + Math.round(ctx.g.minReduction * 100) + ' %</small>' : '');

        h += '<div class="gt"><span class="gl">' + x[0] + '</span><b>&lt;' + fmt(m.goal, 0) + '<i> mg/dL</i></b>' + st + '</div>';

  }

  /* Targeta 1: tractament actual */
  function curLabel() {
    var T = S.tx, p = [], cls = effStatin(T.scale);
    if (cls !== 'none') p.push(statinIsDrug() ? D.describeStatin(T.statinDrug, +T.statinDose) + ' (intensitat ' + D.CLASS_CA[cls] + ')' : D.STATIN_LABEL[cls]);
    var rest = D.describe({ statin: 'none', ez: T.ez, ba: T.ba, pcsk9: T.pcsk9 });
    if (rest !== 'Sense tractament') p.push(rest);
    return p.length ? p.join(' + ') : '—';
  }
  /* Reducció teòrica del tractament actual: amb fàrmac i dosi (mode principal, D6 = C) és la de la dosi, la mateixa de la qual parteixen les pautes (punt 147: abans la línia «Actual» mostrava la de la classe). */
  function curR() {
    var T = S.tx, c = D.combine({ statin: effStatin(T.scale), ez: T.ez, ba: T.ba, pcsk9: T.pcsk9 }, T.scale), se = null;
    if (STATIN_MODE === 'dose' && statinIsDrug()) { try { se = D.statinDoseEff(T.statinDrug, +T.statinDose).e; } catch (e) { se = null; } }
    if (se == null) return c.R;
    var prod = 1; c.parts.forEach(function (x) { prod *= 1 - (x.key.indexOf('statin_') === 0 ? se : x.e) / 100; });
    return 1 - prod;
  }
  function cursumInner() {
    var T = S.tx, label = '—', R = 0;
    try { label = curLabel(); R = curR(); } catch (e) { label = '—'; }

    if (label === '—' && !intolTxt) return 'Sense tractament';

    D.STATINS.forEach(function (st) { if (STATIN_SHORT[st.id]) short = short.replace(st.name, STATIN_SHORT[st.id]); });
    /* S62: dues parts (a mòbil, dues línies a la dreta del LDL: «Actual: fàrmac» i a sota «Reducció teòrica −N %»; a PC, en línia amb « · »). */
    return '<span class="cs1"><b>Actual:</b> ' + esc(short) + '</span>' + (R > 0 ? '<span class="cs-sep"> · </span><span class="cs2">Reducció teòrica <b>−' + fmt(R * 100, 0) + ' %</b></span>' : '') + (intolTxt ? ' · intolerància a estatines' : '');
  }
  /* Controls del tractament actual (estatina, ezetimiba, àcid bempedoic [, intolerància] i anti-PCSK9); compartits amb la calculadora de LDL sense tractament del DLCN.
   * S45 (decisió 159): l'iPCSK9 és un botó com els altres; en marcar-lo es tria el fàrmac (evolocumab, alirocumab o inclisiran; la SEA 2026 en dona l'eficàcia per fàrmac). */
  function pcsk9SubHTML() {

  }
  function txCtlHTML(withIntol) {

    var T = S.tx;

      (withIntol && isPC() ? '<div class="pills pi-int" role="group" aria-label="Intolerància a estatines">' + pill('t-int', 'data-txc="intolerant"', 'Intolerància a estatines', T.intolerant) + '</div>' : '') + '</div>' +

      pill('t-pcsk9', 'data-txc="pcsk9on"', 'iPCSK9', T.pcsk9 !== 'none') + '</div>' +
      '<div class="fld pcsk9-sub" id="pcsk9-sub"' + (T.pcsk9 === 'none' ? ' hidden' : '') + '>' + pcsk9SubHTML() + '</div></div></div>';
  }
  /* S39 (punt 253): al mòbil «Tractament actual» surt plegat quan ja hi ha LDL (només la línia «Actual: …» i «Edita»); sense LDL, desplegat. A PC sempre desplegat. Un cop el clínic l'obre o el tanca, es respecta. */
  function curOpenNow() { return S.curOpen != null ? S.curOpen : true; } /* S45: a mòbil el tractament té pestanya pròpia: obert des del principi */
  /* S59 (feedback d'Aleix): a mòbil, LDL actual estret amb la frase «Actual: … teòric» a la dreta, i a sota el LDL basal amb «calculat, no real» a la dreta: sense scroll en marcar un tractament. */
  function ldlGridHTML() {

    var ldl = lipInput('t-ldl', 'ldl', shown('ldl'), S.u.ldl === 'mmol' ? '3,5' : '135').replace('<input id="t-ldl"', '<input id="t-ldl"' + (S.lc.calc ? ' class="v-calc"' : ''));

      '<div class="lg-tx"><p class="cursum" id="cursum">' + cursumInner() + '</p><span class="ldl-calc" id="t-ldl-note"' + (S.lc.calc ? '' : ' hidden') + '>calculat (' + esc(ldlCalcName()) + '), no real</span></div></div>' +
      '<div class="ldlr" id="base-wrap"' + (hasTx() ? '' : ' hidden') + '><div class="lg-l"><label class="lab" for="t-base">LDL basal</label>' +
      '<details class="ii"><summary aria-label="Què és el LDL basal"><span class="ic" aria-hidden="true">ⓘ</span></summary><p class="hint">LDL sense tractament. Si el saps, el càlcul és exacte; si es deixa buit, es mostra en negreta i cursiva el valor calculat a partir del LDL actual i de l’eficàcia del tractament: és una estimació, mai un valor real, i no es copia enlloc.</p></details></div>' +

      '<div class="lg-tx lg-bn" id="lg-bn"' + (hasTx() ? '' : ' hidden') + '><span class="base-note" id="base-note"' + (S.tx.baseLdl == null && baseEstPh() ? '' : ' hidden') + '>' + BASE_NOTE + '</span></div></div></div>';
  }

  /* ---------- Mòdul 6: càlcul d'LDL (ldlcalc.js) ----------
