}

/* ---------- Sessió 11: unitat per paràmetre (discreta) i estatines per fàrmac i dosi ---------- */
/* El botó de la unitat substitueix l'etiqueta .u: mateix aspecte que el text, amb un subratllat de punts i una fletxa petita. */
.num .ut { position: relative; flex: none; align-self: center; display: inline-flex; align-items: center; gap: 4px; min-width: 38px; min-height: 30px; margin: 0 -4px 0 0; padding: 0 9px; border: 1px solid #BCD5DC; border-radius: 999px; background: var(--soft); color: var(--accent-d); font-size: 12.5px; font-weight: 600; line-height: 1; cursor: pointer; }
.num .ut .ul { text-decoration: none; }
.num .ut svg { flex: none; opacity: .9; }
.num .ut:focus-visible { background: #D6E9EE; border-color: var(--accent); }
@media (hover: hover) { .num .ut:hover { background: #D6E9EE; border-color: var(--accent); } .num .ut:hover svg { opacity: 1; } }
.num .ut::after { content: ""; position: absolute; inset: -8px -4px; } /* àrea de toc ≥ 44 px malgrat el botó visible de 30 px */
.sd-row { display: flex; flex-wrap: wrap; gap: 8px; }
.sd-row select, .card .sel { border: 1.5px solid var(--ctl-line); border-radius: 8px; padding: 8px 10px; min-height: 42px; background: #fff; font-size: 15px; font-weight: 600; max-width: 100%; }
.sd-row select:focus, .card .sel:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px #CFE4EA; }
.sd-row select#t-sd { flex: 1 1 190px; }
.sd-row select#t-sdose { flex: 1 1 150px; }
.sd-cls { margin-top: 8px; }
.rx-s { margin: 5px 0 0; font-size: 12.5px; color: var(--ink2); }
.rx-s b { color: var(--ink); font-weight: 650; }
details.rx-sd { margin: 3px 0 0; }
details.rx-sd > summary { cursor: pointer; font-size: 12.5px; color: var(--accent); font-weight: 600; padding: 3px 0; }
details.rx-sd > p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink2); }

/* ---------- Sessió 13: grups orals / iPCSK9 (76), finançament (77), ajust de dosi per FG (78), colors actual / proposta (80) ---------- */
.grpd { border: 1.5px solid var(--line); border-radius: 12px; margin: 12px 0; background: #fff; }
.grpd > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 12px; font-weight: 700; font-size: 16px; min-height: 48px; }
.grpd > summary::-webkit-details-marker { display: none; }
.grpd > summary::after { content: "▾"; order: 2; flex: none; color: var(--accent); }
.grpd[open] > summary::after { content: "▴"; }
.grpd > summary .gn { order: 0; flex: 1 1 auto; min-width: 0; }
.grpd > summary .tc { order: 1; flex: none; font-weight: 600; font-size: 12.5px; color: var(--accent-d); background: var(--soft); border-radius: 999px; padding: 2px 10px; }
.grpd > summary .frow { order: 3; flex: 0 0 100%; }
.grpd[open] > summary { border-bottom: 1px solid var(--line); }
.grpd > .grpb { padding: 2px 10px 8px; }
.fchip { display: inline-block; font-size: 12.5px; font-weight: 650; padding: 3px 9px; border-radius: 6px; }
.f-ok { background: #DDF0E7; color: #14513A; }
.f-prob { background: #FBE8CC; color: #6B3A00; }
.f-no { background: #E8ECED; color: #3E4D54; }
.f-inc { background: var(--soft); color: var(--accent-d); }
.fld.sit .lab { font-size: 14px; }
.fgh { margin: 12px 0 0; font-size: 14px; color: var(--ink2); }
.fgul { list-style: none; margin: 4px 0 8px; padding: 0; }
.fgl { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.fgl > span:last-child { flex: 1 1 200px; min-width: 0; }
.fgt { flex: none; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 5px; }
.fgesc { display: block; margin-top: 3px; font-size: 12.5px; color: var(--mute); }
.fgesc.fgdisc { color: var(--warn-ink); }
.fg0 .fgt { background: #DDF0E7; color: #14513A; }
.fg1 .fgt { background: #FBE8CC; color: #6B3A00; }
.fg2 .fgt { background: #F6D3AE; color: #5A2A00; }
.fg3 .fgt { background: #F7D9D9; color: #7A1F22; }
.fgn .fgt { background: #E2E6E8; color: #3E4D54; }
@media print {
  .card.cur, .card.prop, .fgt, .fchip { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* Sessió 15: vista per dosi i objectius secundaris (només classes, sense estils en línia) */
.legend.more2 { margin-top: 10px; }
.legend.more2 > summary { font-weight: 600; }
.dosev table.cmp th .hint { display: block; margin: 2px 0 0; font-weight: 400; }
.dosev h4.fgh { margin-top: 14px; }
.dlbydose { margin-top: 8px; }
#sec-res { margin-top: 8px; }
/* Sessió 16: fàrmacs i dosis amb la reducció per dosi dins de cada pauta (D6 = C) */
.rx-ol { list-style: none; margin: 3px 0 0; padding: 0; }
.rx-op { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 10px; align-items: baseline; padding: 3px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink2); }
.rx-op:first-child { border-top: 0; }
.rx-op .o-n { min-width: 0; }
.rx-op .o-r { font-family: var(--num); font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums lining-nums; }
.rx-op .o-l { color: var(--mute); font-variant-numeric: tabular-nums; }
.rx-op.ok .o-r { color: var(--accent); }

/* Sessió 25: etiquetes de camp (obligatori / necessari per a la teràpia / opcional), reducció per principi actiu i estimació de no-HDL/apoB */
.req { font-weight: 650; color: #9A2F2F; font-size: 12.5px; letter-spacing: .01em; }
.rec { font-weight: 600; color: #8A5A00; font-size: 12.5px; }
.opt { font-weight: 400; color: var(--mute); font-size: 12.5px; }
.legendreq { margin: 4px 0 10px; }
.partsl { margin: 4px 0 4px; padding-left: 18px; font-size: 12.5px; color: var(--ink2); }
.partsl li { margin: 3px 0; }
.partsl .pe { font-weight: 650; color: var(--ink); }
.nofig { color: #8A5A00; }
details.estp > summary { display: block; }
details.estp > summary .el { display: block; font-weight: 400; color: var(--ink2); font-size: 12.5px; margin-top: 1px; }
details.est { margin-top: 10px; }
.mini .req, .mini .rec, .mini .opt { display: inline; }


/* ---------- Redisseny, fase 1: carcassa (pestanyes, icones, franja de pacient, full inferior, Ajustos) ---------- */
:root { --tabh: calc(58px + env(safe-area-inset-bottom)); }
.brand .hact { flex: none; display: flex; gap: 2px; margin-right: -8px; }
.ibtn { flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 10px; background: none; color: var(--accent); cursor: pointer; font-size: 26px; line-height: 1; }
.ibtn svg { width: 24px; height: 24px; }
.ibtn.on { background: var(--soft); }
@media (hover: hover) { .ibtn:hover { background: var(--soft); } }
.ibtn.sm { width: 36px; height: 36px; }
.ibtn.sm svg { width: 20px; height: 20px; }

.strip { display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 18px; background: #F6FAFB; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--ink2); }
.strip-in { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.strip-in b { color: var(--ink); font-weight: 650; }
.strip-in .sd { color: var(--mute); }
.strip .chip { font-size: 13px; }

.nav { bottom: var(--tabh); padding-bottom: 10px; }
.tabs { position: sticky; bottom: 0; z-index: 6; display: flex; background: var(--sheet); border-top: 1px solid var(--line); padding: 0 2px env(safe-area-inset-bottom); }
.tabs button { position: relative; flex: 1; min-width: 0; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; color: var(--mute); font-size: 12px; font-weight: 600; cursor: pointer; }
.tabs button svg { width: 24px; height: 24px; }
@media (hover: hover) { .tabs button:hover { color: var(--accent-d); } }
.tabs button.on { color: var(--accent); }
.tabs button.on::before { content: ''; position: absolute; top: 0; left: 24%; right: 24%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }

.setrow { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.setrow > div { flex: 1; min-width: 0; }
.setrow b { display: block; font-size: 16px; }
.setrow span { display: block; font-size: 13.5px; color: var(--ink2); line-height: 1.35; }

.sheet-bg { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(22, 36, 43, .45); }
.sheet-p { width: 100%; max-width: 560px; max-height: 86vh; max-height: 86dvh; display: flex; flex-direction: column; background: var(--sheet); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, .22); padding-bottom: env(safe-area-inset-bottom); }
.sheet-p::before { content: ''; align-self: center; flex: none; width: 40px; height: 4px; margin-top: 8px; border-radius: 2px; background: var(--line); }
.sheet-h { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 8px 4px 18px; }
.sheet-t { flex: 1; min-width: 0; margin: 0; font-size: 18px; line-height: 1.25; font-weight: 650; }
.sheet-b { overflow: auto; padding: 0 18px 18px; }
.sheet-b > p:first-child { margin-top: 0; }
.sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
.sheet-actions .btn { flex: 1; padding: 0 12px; }
body.noscroll { overflow: hidden; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + 72px); transform: translateX(-50%); z-index: 30; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 4px 16px rgba(0, 0, 0, .25); }
@media (prefers-reduced-motion: no-preference) {
  .sheet-bg:not([hidden]) .sheet-p { animation: sheetUp .22s ease-out; }
  @keyframes sheetUp { from { transform: translateY(28px); opacity: .5; } to { transform: none; opacity: 1; } }
}
@media (min-width: 900px) {
  .strip { padding-left: 40px; padding-right: 32px; }
  .nav { padding-bottom: 12px; }
}

/* ===== Fase 2 (sessió 27): Teràpia compacta ===== */
/* Rajoles d'objectius: LDL, c-no-HDL i apoB junts */
.goalcat { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; margin: 10px 0 0; font-size: 14px; color: var(--ink2); }
.goalcat b { color: var(--ink); }
.goalbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; margin: 8px 0 0; }
.gt { border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 8px 10px 7px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.gt .gl { font-size: 12px; font-weight: 650; color: var(--mute); letter-spacing: .02em; }
.gt b { font-family: var(--num); font-size: 21px; font-weight: 600; color: var(--ink); line-height: 1.15; font-variant-numeric: lining-nums; }
.gt b i { font-style: normal; font-family: inherit; font-size: 11.5px; font-weight: 500; color: var(--mute); margin-left: 2px; }
.gt-ldl { border-color: var(--accent); background: #F2F9FB; }
.gt small { font-size: 12px; font-weight: 650; }
.gt small.over { color: #B3363A; }
.gt small.okk { color: #1F7050; }
/* Tractament actual: una línia que es desplega per editar */
details.cured { margin: 0 0 8px; }
details.cured > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 0; color: var(--ink); }
details.cured > summary::-webkit-details-marker { display: none; }
details.cured > summary .cursum { flex: 1; min-width: 0; margin: 0; }
details.cured > summary .edl::after { content: "Edita ▾"; font-size: 13.5px; font-weight: 650; color: var(--accent); white-space: nowrap; }
details.cured[open] > summary .edl::after { content: "Tanca ▴"; }
details.cured > summary:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; border-radius: 10px; }
details.cured > :not(summary) { margin-top: 12px; }
#cur-fg:empty { display: none; }
/* Icona ⓘ: explicació a un toc (en línia, sense full inferior; la prosa surt de la vista principal) */
details.ii { display: inline-block; vertical-align: middle; margin: 0 0 0 6px; }
details.ii > summary { list-style: none; cursor: pointer; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; padding: 0; color: var(--accent); }
details.ii > summary::-webkit-details-marker { display: none; }
details.ii > summary .ic, .rx-i > summary .ic { font-size: 17px; line-height: 1; }
details.ii > summary:focus-visible, .rx-i > summary:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 1px; }
details.ii[open] { display: block; margin: 4px 0 0; }
details.ii[open] > summary { display: inline-grid; }
details.ii > p { margin: 2px 0 6px; }
.needrow { display: flex; flex-wrap: wrap; align-items: center; margin: 0 0 6px; }
.needrow .need { margin: 0; }
.needrow details.ii[open] { flex: 0 0 100%; }
.base-wrap-ii { display: inline; }
#base-wrap .lab { display: inline-block; }
.card > h3 .scl { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--accent-d); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.pills.keep { margin: 0 0 8px; }
.pills.keep .pill span { min-height: 36px; padding: 6px 12px; font-size: 13.5px; }
/* Pauta compacta: detall a la icona ⓘ */
.rx-m { align-items: center; }
.rx-i { margin-left: auto; }
.rx-i > summary { list-style: none; cursor: pointer; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: var(--accent); }
.rx-i > summary::-webkit-details-marker { display: none; }
.rx-i[open] { flex: 0 0 100%; margin-left: 0; }
.rx-i[open] > summary { margin-left: auto; display: grid; }
.rx-ib { padding: 2px 0 4px; }
.rx-ib > :first-child { margin-top: 0; }
/* Avís de fonts: una línia amb ⚠ sempre visible */
details.flagsd { margin: 0 0 8px; }
details.flagsd > summary { display: flex; align-items: center; gap: 8px; list-style: none; cursor: pointer; font-weight: 600; color: #8A4D06; padding: 6px 0; }
details.flagsd > summary::-webkit-details-marker { display: none; }
details.flagsd > summary::after { content: "▾"; margin-left: auto; color: var(--accent); }
details.flagsd[open] > summary::after { content: "▴"; }
/* Fàrmacs i evidència (provisional) */
details.refbox { margin-top: 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 0 12px; }
details.refbox > summary { font-weight: 650; padding: 12px 0; }
details.refbox > summary .rr { font-weight: 400; color: var(--mute); font-size: 12.5px; margin-left: 6px; }
details.refbox[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 6px; }
details.refbox > .legend, details.refbox > .note { margin-left: 0; }
/* Xip de risc de la franja: botó cap al Resultat */
.chipbtn { all: unset; cursor: pointer; display: inline-flex; border-radius: 999px; padding-block: 2px; margin-block: -2px; } /* S70 bloc 3 (C-08): objectiu ≥24 px sense créixer la franja */
.chipbtn:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.chipbtn .chip::after { content: "›"; margin-left: 6px; font-weight: 700; }
/* Ajustos */
.setcard { margin-top: 10px; }
.setcard .seg { margin-top: 6px; }
details.fundd { margin: 0 0 6px; }
details.fundd > summary { font-size: 13px; padding: 4px 0; }
.card > h3 { flex-wrap: wrap; }
#sd-hint:not(.warn):not(.err) { display: none; }
details.refbox { overflow-wrap: anywhere; min-width: 0; }
details.refbox table.cmp { display: block; max-width: 100%; overflow-x: auto; }
details.refbox .fundl, details.refbox .legend { min-width: 0; }
.ibtn:disabled { opacity: .35; cursor: default; }
@media (hover: hover) { .ibtn:disabled:hover { background: none; } }

/* F3a: pestanya Fàrmacs i evidència */
.lnkbtn { background: none; border: 0; padding: 3px 0; margin: -3px 0; font: inherit; font-weight: 650; color: var(--accent); text-decoration: underline; cursor: pointer; }
.toref { margin: 14px 0 4px; }
details.drugcard .fgh { margin: 14px 0 4px; }
details.drugcard .srcul { padding-left: 18px; margin: 6px 0; }
details.drugcard .fgul { min-width: 0; }
details.drugcard table.cmp th { overflow-wrap: normal; word-break: normal; min-width: 6em; }
details.drugcard table.cmp td { overflow-wrap: break-word; }

/* F3b: classes de recomanació i nivells d'evidència per guia */
.recfilt { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.rfb { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line, #C9CED6); border-radius: 999px; background: transparent; color: var(--ink2); cursor: pointer; min-height: 32px; }
.rfb.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 650; }
.recl { list-style: none; margin: 4px 0 0; padding: 0; }
.rrow { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; font-size: 13.5px; color: var(--ink2); }
.rcl { flex: 0 0 auto; min-width: 46px; text-align: center; font-weight: 700; font-size: 12.5px; padding: 3px 6px; border-radius: 6px; white-space: nowrap; }
.rc-I { background: #DDF0E7; color: #1D5F45; }
.rc-IIa { background: #FBE8CC; color: #7A4608; }
.rc-IIb { background: #F9DDC4; color: #7A3A08; }
.rc-III { background: #F7D9D9; color: #8A2527; }
.rc-ng { background: #E8EAEE; color: #4A5260; font-weight: 600; font-size: 11.5px; }
.rtx { flex: 1 1 auto; min-width: 0; }
.rsrc { display: block; margin-top: 2px; font-size: 12px; color: var(--mute); }
.discd { margin: 4px 0 8px; }
/* ---------- Guies per situació: matriu, full de detall i aval d'objectius (sessió 31) ---------- */
.srl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sitbox { margin: 14px 0 6px; padding: 12px 10px 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
.sith { margin: 0 0 8px; font-size: 15px; font-weight: 700; }
.sith2 { margin: 18px 0 4px; }
.sitlab { display: block; margin: 0 0 4px; font-size: 12.5px; font-weight: 600; color: var(--mute); }
.sitsel { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 0 14px; background: #fff; border: 1.5px solid #7B8A92; border-radius: 12px; font-size: 15px; font-weight: 700; text-align: left; cursor: pointer; }
.sitl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sitopt { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 6px 14px; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; }
.sitopt.on { border-color: var(--accent); background: var(--soft); font-weight: 700; }
.sitpt { flex: none; padding: 2px 8px; border: 1px solid var(--accent); border-radius: 10px; background: #fff; color: var(--accent-d); font-size: 11.5px; font-weight: 700; }
.mx { width: 100%; margin: 6px 0 0; border-collapse: separate; border-spacing: 4px 6px; table-layout: fixed; }
.mx th[scope=col] { padding: 2px 0; text-align: center; vertical-align: bottom; font-size: 11px; font-weight: 700; line-height: 1.2; }
.mx td:first-child { width: 84px; }
.mx td { padding: 0; }
.mxr { width: 84px; padding: 0; text-align: left; vertical-align: middle; font-size: 13px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.mxs { display: block; font-size: 10.5px; font-weight: 400; color: var(--mute); }
.mxw { color: #8A4B00; font-weight: 700; }
.mxc { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 100%; min-height: 56px; padding: 4px 2px; background: #fff; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.mxc .rcl { min-width: 0; padding: 3px 5px; font-size: 11.5px; }
.mxc .rc-ng { white-space: normal; font-size: 10.5px; line-height: 1.1; }
.mxm { font-size: 10.5px; font-weight: 600; color: var(--ink2); }
.mxn { display: flex; align-items: center; justify-content: center; min-height: 56px; border: 1px dashed #C3CED1; border-radius: 10px; color: var(--mute); font-weight: 700; }
.mxabs { margin: 8px 0 0; font-size: 12.5px; color: var(--ink2); }
.pendl { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.pendc { display: inline-flex; align-items: center; flex: none; min-height: 24px; padding: 0 9px; border: 1px dashed #7B8A92; border-radius: 12px; background: #fff; color: var(--mute); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.dsh { margin: 14px 0 6px; font-size: 13px; font-weight: 700; color: var(--warn-ink); }
.dsb { display: flex; width: 100%; align-items: center; gap: 8px; min-height: 44px; margin: 0 0 6px; padding: 6px 8px 6px 12px; background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; color: #4A2A00; font-size: 13px; font-weight: 600; text-align: left; cursor: pointer; }
.dsb > span { flex: 1; min-width: 0; }
.mxlg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 10px 0 0; font-size: 11px; color: var(--ink2); }
.mxlg > span { display: inline-flex; align-items: center; gap: 4px; }
.rc-dif { background: var(--warn-bg); color: var(--warn-ink); font-size: 11.5px; font-weight: 600; }
.dtsub { margin: 0 0 8px; font-size: 12.5px; color: var(--ink2); }
.dtc { display: flex; flex-direction: column; gap: 5px; margin: 0 0 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.dth { display: flex; align-items: center; gap: 10px; }
.dtcl { padding: 4px 12px; border-radius: 15px; font-size: 15px; }
.dtm { font-size: 11.5px; line-height: 1.3; color: var(--ink2); }
.dtx { margin: 0; font-size: 13.5px; line-height: 1.4; }
.dts { font-size: 11.5px; color: var(--mute); }
.dtcite { margin: 10px 0 0; font-size: 11px; line-height: 1.35; color: var(--mute); }
.dsc { display: flex; flex-direction: column; gap: 7px; margin: 0 0 8px; padding: 10px 12px; background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 12px; color: #4A2A00; }
.dsc h3 { margin: 0; font-size: 13px; font-weight: 700; }
.dsc p { margin: 0; font-size: 12px; line-height: 1.4; }
.dsr { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; }
.dsr b { flex: none; width: 92px; padding-top: 3px; }
.dsgs { display: flex; flex: 1; min-width: 0; flex-wrap: wrap; gap: 4px 10px; }
.dsg { display: inline-flex; align-items: center; gap: 6px; }
.gsup { margin: 12px 0 0; }
.gsl { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.gsi { display: flex; width: 100%; align-items: center; gap: 10px; min-height: 56px; padding: 8px 8px 8px 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; text-align: left; }
button.gsi { cursor: pointer; }
.gsi.gsn { min-height: 48px; border-style: dashed; background: transparent; }
.gsk { display: flex; flex: none; }
.gst { display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 2px; font-size: 11.5px; line-height: 1.3; color: var(--ink2); }
.gst b { font-size: 13.5px; color: var(--ink); }
.gss { font-weight: 600; }
.gsi-sup .gss { color: #14513A; }
.gsi-txt .gss { color: #3C4B53; }
.gsi-dif .gss { color: var(--warn-ink); }


/* Selector de país amb cerca (origen i residència) i escala regional (194b+) */
.pick { all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 48px; margin-top: 4px; padding: 8px 12px; border: 1.5px solid var(--ctl-line); border-radius: 8px; background: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
.pick.empty { color: var(--mute); font-weight: 500; }
.pick:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.pick .pk-chev { flex: none; }
.pk-q { box-sizing: border-box; position: sticky; top: 0; z-index: 1; width: 100%; min-height: 46px; margin: 4px 0 8px; padding: 8px 12px; border: 1.5px solid var(--ctl-line); border-radius: 8px; background: #fff; font-size: 16px; }
.pk-list { display: flex; flex-direction: column; }
.pk-h { margin: 14px 0 4px; font-size: 13px; font-weight: 650; color: var(--ink2); }
.pk-row { all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 46px; padding: 8px 10px; border-radius: 8px; font-size: 16px; cursor: pointer; }
@media (hover: hover) { .pk-row:hover { background: #E8F1F4; } }
.pk-row.on { background: #E8F1F4; font-weight: 650; box-shadow: inset 0 0 0 2px #115E73; }
.pk-row:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: -1px; }
.pk-row.on:focus-visible { outline-offset: -4px; } /* no es fon amb la vora de 2 px de la fila triada */
.pk-tag { flex: none; display: inline-block; padding: 1px 8px; border-radius: 999px; background: #DCEBF0; color: #0B4658; font-size: 12px; font-weight: 650; }
.wbands { display: flex; gap: 4px; margin: 10px 0; }
.wbands > div { flex: 1; padding: 7px 2px; border-radius: 6px; background: #EEF3F4; color: var(--ink2); font-size: 11.5px; line-height: 1.25; text-align: center; font-variant-numeric: tabular-nums; }
.wbands > div.on { background: #115E73; color: #fff; font-weight: 700; }
.pk-row { width: 100%; }
.wbands { align-items: stretch; }
.wbands > .hint { align-self: center; margin: 0 0 0 2px; }

/* ===== Fase 5 (sessió 37): adaptació a PC (≥900 px). El mòbil no canvia (decisions 102–104) ===== */
.hact .hl { display: none; }
@media (min-width: 900px) {
  :root { --sw: 72px; --tabh: 0px; --toph: 52px; --cw: 1480px; }
  body { padding: 0; }
  .top, .top:not(:has(.steps:not([hidden]))) { padding-top: 9px; padding-bottom: 9px; }
  .brand p { display: none; }
  .brand h1 { font-size: 18px; }
  #app { max-width: none; margin: 0 0 0 var(--sw); min-height: 100vh; border-radius: 0; box-shadow: none; overflow: visible; }
  .top, .strip, .nav, main { padding-inline: max(32px, calc((100% - var(--cw)) / 2 + 32px)); }

  /* Barra lateral esquerra enganxada: només icones (900–1199 px) */
  .tabs { position: fixed; left: 0; top: 0; bottom: 0; z-index: 4; width: var(--sw); flex-direction: column; justify-content: flex-start; gap: 6px; padding: 16px 8px 168px; border-top: 0; border-right: 1px solid var(--line); overflow-y: auto; }
  .tabs button { flex: none; min-height: 58px; border-radius: 12px; }
  @media (hover: hover) { .tabs button:hover { background: var(--soft); } }
  .tabs button.on { background: var(--soft); }
  .tabs button.on::before { top: 12px; bottom: 12px; left: -8px; right: auto; width: 4px; height: auto; border-radius: 0 4px 4px 0; }
  .tabs button span { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .brand .hact { position: fixed; left: 0; bottom: 0; width: var(--sw); flex-direction: column; align-items: center; gap: 4px; margin: 0; padding: 10px 0 14px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--sheet); }
  .hact .ibtn:disabled { opacity: .4; cursor: not-allowed; }
  .toast { left: calc(50% + var(--sw) / 2); bottom: 28px; max-width: calc(100vw - var(--sw) - 32px); }

  /* Risc: Dades i Resultat una al costat de l'altra, amb el resultat en viu (decisió 103) */
  .pcw { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); column-gap: 40px; align-items: start; }
  .pcw-l { min-width: 0; }
  .pcw-r { min-width: 0; position: sticky; top: calc(var(--toph) + 12px); max-height: calc(100vh - var(--toph) - 24px); overflow-y: auto; overscroll-behavior: contain; padding: 4px 10px 12px 4px; margin: -4px -10px 0 -4px; }
  .pcw .sec:has(> .fld .ctl) { grid-template-columns: 1fr; }
  .pcw #live2 { display: none; }
  .pcw-r .kv { grid-template-columns: 1fr; }
  .pcw-r .kv > div { border-left: 0; padding: 6px 0; border-top: 1px solid var(--line); }
  .pcw-r .kv > div:first-child { border-top: 0; }
  .pcw-empty { margin-top: 14px; }
  .pcw .fld { margin-bottom: 14px; }
  .pcw .hint { font-size: 12.5px; }

  /* Resultat de PC (sessió 38): capçalera amb el botó, heroi (velocímetre petit + franges) i objectiu de LDL a dalt */
  .rs-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 2px; }
  .rs-head h2 { margin: 0; }
  .rs-head .btn { min-height: 44px; padding: 0 18px; font-size: 15px; flex: none; }
  .rs-hero { display: grid; grid-template-columns: minmax(0, 270px) minmax(0, 1fr); column-gap: 22px; align-items: center; margin: 6px 0 2px; }
  .rs-g { min-width: 0; }
  .rs-hero .gauge { max-width: 270px; margin: 0 auto; }
  .rs-hero .gcap { font-size: 12px; line-height: 1.3; }
  .rs-k { min-width: 0; }
  .rs-k .pure-line { justify-content: flex-start; margin: 0 0 8px; }
  .rs-k .bands { margin: 0; max-width: none; flex-direction: column; gap: 4px; }
  .rs-k .bands > div { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; }
  .rs-k .legend { margin-top: 4px; }
  .goalsec .sec { padding-top: 12px; padding-bottom: 12px; }
  .goalsec h3 { margin-bottom: 8px; }
  .goalsec .kv { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 14px; }
  .goalsec .kv > div { border-top: 0; border-left: 1px solid var(--line); padding: 2px 0 2px 14px; }
  .goalsec .kv > div:first-child { border-left: 0; padding-left: 0; }
  .goalsec .kv dd { font-size: 16px; }
  .goalsec .kv .big { font-size: 24px; }
  .goalsec .kv dd small { font-size: 12px; line-height: 1.3; }
  .pcw-r > .sec { padding-top: 12px; padding-bottom: 12px; }
  .pcw-r details.country { margin-top: 6px; }
  .pcw-r details.country summary { padding: 10px 0; }
  .pcw-r .legend { margin-top: 6px; }
  .pcw-r #copy-btn, .pcw-r [data-act=reset] { display: none; }

  /* Teràpia: objectius i tractament actual a l'esquerra (enganxats); pautes, triglicèrids i avisos a la dreta */
  /* S40: franja d'objectius a dalt, a tot l'ample */
  .tx-top { margin-bottom: 14px; }
  .tx-top #goal5 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; }
  .tx-top .goalbar { margin: 0; grid-template-columns: repeat(3, 150px); }
  .tx-top .legend.ovr { margin: 0 0 0 auto; }
  .tx-2 { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); column-gap: 40px; align-items: start; }
  .tx-l, .tx-r { min-width: 0; }
  .tx-l { position: sticky; top: calc(var(--toph) + 12px); max-height: calc(100vh - var(--toph) - 24px); overflow-y: auto; overscroll-behavior: contain; padding: 4px 10px 12px 4px; margin: -4px -10px 0 -4px; }
  .tx-l .tx-cols { grid-template-columns: 1fr; }
  /* S40: «Tractament actual» compacte perquè càpiga en 1366×768 */
  .tx-l .card.cur { padding: 12px 16px 4px; margin-top: 0; }
  .tx-l .card.cur > h3 { margin-bottom: 8px; }
  .tx-l .card .fld { margin-bottom: 10px; }
  .tx-l .card .lab { margin-bottom: 3px; }
  .tx-l .pill span { padding: 6px 12px; min-height: 36px; font-size: 14px; }
  .tx-l .pills { gap: 6px; margin-bottom: 8px; }
  .tx-l .cursum { padding: 7px 10px; margin-bottom: 6px; }
  .tx-l .card.cur .seg.sm { height: 40px; }
  .tx-l .card.cur .num { height: 42px; }
  .tx-r .rxl { grid-template-columns: 1fr; }

  /* Fàrmacs: graella de dues columnes; una targeta oberta ocupa tot l'ample */
  .drugs-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; align-items: start; }
  .drugs-grid > details { min-width: 0; }
  .drugs-grid > details[open] { grid-column: 1 / -1; }

  /* DLCN: entrada a l'esquerra, resultat enganxat a la dreta */
  .dl-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); column-gap: 40px; align-items: start; }
  .dl-grid > .card:first-child { grid-column: 1; grid-row: 1; }
  .dl-secs { grid-column: 1; grid-row: 2; min-width: 0; }
  #dl-live { grid-column: 2; grid-row: 1 / span 2; min-width: 0; position: sticky; top: calc(var(--toph) + 12px); max-height: calc(100vh - var(--toph) - 24px); overflow-y: auto; overscroll-behavior: contain; padding: 0 10px 12px 4px; margin: 0 -10px 0 -4px; }
  #dl-foot { grid-column: 1 / -1; grid-row: 3; }

  /* Càlcul d'LDL: entrada a l'esquerra, resultat enganxat a la dreta */
  .lc-cols { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); column-gap: 40px; align-items: start; }
  .lc-in .num, .dl-grid .fld .num { max-width: 340px; }
  .lc-in .btn.block { width: auto; max-width: 340px; padding: 0 16px; }
  .lc-in, .lc-out { min-width: 0; }
  .lc-out { position: sticky; top: calc(var(--toph) + 12px); max-height: calc(100vh - var(--toph) - 24px); overflow-y: auto; overscroll-behavior: contain; padding: 0 10px 12px 4px; margin: 0 -10px 0 -4px; }

  /* Fulls inferiors → calaix lateral dret d'uns 560 px (decisió 104) */
  .sheet-bg { align-items: stretch; justify-content: flex-end; }
  .sheet-p { width: min(560px, calc(100vw - var(--sw) - 32px)); max-width: none; max-height: none; height: 100%; border-radius: 0; box-shadow: -8px 0 30px rgba(0, 0, 0, .22); padding-bottom: 0; }
  .sheet-p::before { display: none; }
  .sheet-h { padding-top: 14px; }
}
@media (min-width: 900px) and (prefers-reduced-motion: no-preference) {
  .sheet-bg:not([hidden]) .sheet-p { animation: sheetIn .22s ease-out; }
  @keyframes sheetIn { from { transform: translateX(28px); opacity: .5; } to { transform: none; opacity: 1; } }
}
/* Pantalles àmplies (≥1500 px): Pacient i exclusions | Dades clíniques | Resultat, tot a la vista (sessió 38) */
@media (min-width: 1500px) {
  .pcw { grid-template-columns: minmax(0, .85fr) minmax(0, .85fr) minmax(0, 1.3fr); column-gap: 32px; }
  .pcw-l { display: contents; }
  .pcw-a, .pcw-b { min-width: 0; }
}
@media (max-width: 1199px) {
  .rs-hero { grid-template-columns: minmax(0, 1fr); row-gap: 8px; }
  .goalsec .kv { grid-template-columns: 1fr; }
  .goalsec .kv > div { border-left: 0; padding: 6px 0; border-top: 1px solid var(--line); }
  .goalsec .kv > div:first-child { border-top: 0; }
}
/* Barra lateral amb icones i text (≥1200 px) */
@media (min-width: 1200px) {
  :root { --sw: 216px; }
  .tabs { padding: 18px 12px 168px; }
  .tabs button { flex-direction: row; justify-content: flex-start; gap: 14px; min-height: 48px; padding: 0 14px; font-size: 15px; }
  .tabs button span { position: static; width: auto; height: auto; margin: 0; overflow: visible; clip: auto; white-space: normal; }
  .tabs button.on::before { left: -12px; }
  .brand .hact { align-items: stretch; padding: 10px 12px 14px; }
  .hact .ibtn { width: 100%; display: flex; justify-content: flex-start; align-items: center; gap: 14px; height: 44px; padding: 0 14px; font-size: 15px; font-weight: 600; }
  .hact .hl { display: inline; }
}
@media print {
  #app { margin-left: 0; }
  .brand .hact { display: none; }
}
/* F5: a PC el LDL actual es dóna una sola vegada (a Dades, a l'esquerra); al panell de resultat no es repeteix */
@media (min-width: 900px) { .pcw-r .ldlin { display: none; } }

/* Sessió 38: camps en parella, sense lliscadors (decisió 108); lead amb ⓘ; controls secundaris plegats */
.fpair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto auto; column-gap: 14px; }
.fpair > .fld { display: grid; grid-template-columns: minmax(0, 1fr); grid-row: span 3; grid-template-rows: subgrid; row-gap: 0; align-content: start; min-width: 0; }
.fpair > .fld > .hint { margin-top: 4px; }
.fpair .ctl { display: block; }
.fpair .num { display: flex; width: 100%; box-sizing: border-box; }
.fpair .fld .num input { flex: 1 1 0; width: 0; min-width: 0; }
@media (max-width: 359px) {
  .fpair { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
  .fpair > .fld { display: block; grid-row: auto; }
}
.leadrow { display: flex; align-items: flex-start; gap: 4px; }
.leadrow > .lead { margin: 0 0 8px; flex: 1 1 0; min-width: 0; }
.leadrow > details.ii { flex: 0 0 auto; margin-left: 0; }
.leadrow > details.ii[open] { flex: 1 1 100%; }
.leadrow { flex-wrap: wrap; }
.goalsec .legend.ovr { margin-top: 6px; }
.legend.ovr > summary { font-size: 13.5px; font-weight: 600; }
.legend.ovr .override { margin-top: 2px; }
.thrsel { margin: 4px 0 10px; }

/* ---------- Sessió 39: mòbil compacte i Teràpia més visual (decisions 110–115) ---------- */
/* Barra de reducció de cada pauta (SVG: la reducció de la pauta i una marca amb la necessària) */
.rbar { display: block; width: 100%; height: 6px; margin: 6px 0 0; border-radius: 3px; overflow: hidden; }
.rb-bg { fill: #DDE6E8; }
.rb-fg { fill: var(--accent); }
.rb-t { fill: #16242B; }
.rx-m .alt { color: var(--accent-d); font-weight: 600; }
.sd-dw { display: contents; }
.h2row { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; margin: 0 0 6px; }
.h2row h2 { margin: 0; }
.h2row details.ii { margin-left: 0; }
.h2row details.ii[open] { flex: 0 0 100%; }
.cond-h { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
.cond-h > .chk { flex: 1 1 0; min-width: 0; }
.cond-h details.ii { flex: 0 0 auto; margin-left: 0; }
.cond-h details.ii[open] { flex: 0 0 100%; }
.orig .pick span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

@media (max-width: 899px) {
  :root { --tabh: calc(52px + env(safe-area-inset-bottom)); }
  /* Marc: capçalera, barra d'accions i pestanyes més baixes (≈ 45 px més per al contingut) */
  .top { padding: calc(8px + env(safe-area-inset-top)) 16px 0; }
  .top:not(:has(.steps:not([hidden]))) { padding-bottom: 8px; }
  .brand h1 { font-size: 16px; }
  .steps { margin-top: 6px; }
  .steps button, .steps span.st { padding-bottom: 3px; }
  .steps .bar { margin-bottom: 3px; }
  .steps .lbl { font-size: 12px; }
  .nav { padding: 6px 16px 6px; }
  .nav .btn { min-height: 44px; }
  .tabs button { min-height: 52px; gap: 2px; }
  .strip { padding: 4px 10px 4px 16px; font-size: 13px; }
  main { padding: 12px 16px 18px; }
  h2 { font-size: 19px; margin-bottom: 4px; }
  h3 { margin-bottom: 6px; font-size: 15px; }
  .sec { padding: 10px 0; }
  .sec:first-of-type { padding-top: 2px; }
  .who { font-size: 13px; margin: 0 0 4px; }
  .note { padding: 8px 12px; margin: 8px 0 0; font-size: 13.5px; }
  /* Camps: etiquetes curtes, parelles, sense explicacions sota els camps (van al ⓘ del títol) */
  .fld { margin-bottom: 10px; }
  .fld > label, .lab { font-size: 14px; margin-bottom: 3px; }
  .fld .req, .fld .rec, .fld .opt { font-size: 11.5px; }
  .fld[data-k] > .hint:not(.warn):not(.err) { display: none; }
  .num { min-height: 44px; }
  .num input { padding: 8px 0; }
  .seg span { padding: 9px 8px; min-height: 44px; }
  .pick { min-height: 46px; margin-top: 3px; }
  .fpair { column-gap: 12px; }
  /* Pas 1: situacions en files baixes; descripcions i ajudes dins del ⓘ */
  .cond { padding: 2px 0; }
  .cond-h > .chk { align-items: center; padding: 9px 0; }
  .chk .t { font-size: 15px; }
  .cond .sub { margin: 2px 0 6px 36px; }
  .cond .sub > p.hint { display: none; }
  .sub .row { margin-bottom: 6px; gap: 10px; }
  /* Resultat: heroi compacte i objectiu de LDL a la primera pantalla */
  .rs-hero { display: grid; grid-template-columns: minmax(0, 168px) minmax(0, 1fr); column-gap: 12px; align-items: center; margin: 2px 0 4px; }
  .rs-hero .gauge { max-width: 168px; margin: 0; }
  .rs-hero .gauge .tick, .rs-hero .gauge .sub { font-size: 20px; }
  .rs-k { min-width: 0; }
  .rs-k .pure-line { justify-content: flex-start; margin: 0 0 6px; }
  .rs-k .chip { font-size: 13px; }
  .rs-k .bands { margin: 0; flex-direction: column; gap: 3px; }
  .rs-k .bands > div { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 4px 8px; }
  .goalsec { padding: 6px 0 4px; }
  .goalsec > h3 { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .goalsec .kv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); column-gap: 12px; }
  .goalsec .kv > div { padding: 4px 0; border-top: 0; }
  .goalsec .kv > div:nth-child(3) { grid-column: 1 / -1; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; }
  .goalsec .kv dt { font-size: 12.5px; }
  .goalsec .kv dd { font-size: 16px; }
  .goalsec .kv dd .big { font-size: 22px; }
  .goalsec .kv dd small.exp { display: none; }
  .goalsec .kv dd small { font-size: 12px; margin-top: 1px; }
  .legend { margin-top: 4px; }
  .legend summary { padding: 6px 0; }
  details.country { margin-top: 8px; }
  details.country > summary { padding: 11px 12px; min-height: 46px; }
  /* Teràpia */
  .card { padding: 10px 12px 2px; margin: 10px 0 0; }
  .card > h3 { margin: 0 0 8px; font-size: 15px; }
  .card .fld { margin-bottom: 8px; }
  .fld.ldl-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .fld.ldl-row > label { margin: 0; }
  .goalcat { margin-top: 6px; }
  .gt { padding: 6px 10px 5px; }
  .gt b { font-size: 19px; }
  .cursum { padding: 8px 10px; font-size: 14px; }
  .tierd { margin: 6px 0; }
  .tierd > summary { padding: 8px 10px; min-height: 42px; }
  .tierd .rxl { padding: 8px; gap: 6px; }
  .grpd { margin: 8px 0; }
  .grpd > summary { padding: 8px 12px; min-height: 44px; font-size: 15.5px; }
  .rx { padding: 7px 10px; }
  .rx-n { font-size: 14.5px; }
  .rx-r { font-size: 20px; }
  .need { font-size: 14.5px; }
  .need .big { font-size: 22px; }
  .sd-row { gap: 6px; }
  .toref { margin: 6px 0; }

  /* Sessió 39 (Teràpia): franja d'una sola línia i títols de targeta sense salt */
  .strip-in { flex-wrap: nowrap; gap: 6px; overflow: hidden; white-space: nowrap; }
  .strip-in .sd { display: none; }
  .strip .chip { font-size: 12px; padding: 2px 8px; }
  .card.prop > h3 { display: flex; align-items: center; gap: 8px; font-size: 14.5px; }
  .card.prop > h3 .scl { font-size: 11.5px; padding: 1px 8px; white-space: nowrap; }
  /* Sessió 39 (DLCN i LDL): ajudes fora de la vista; criteris més baixos */
  #dl-age-h:not(.warn):not(.err) { display: none; }
  .dl-score .big { font-size: 38px; }
  .dl-parts { grid-template-columns: 1fr 1fr; column-gap: 16px; }
  .dl-parts li { padding: 5px 0; }
  .dl-parts li:nth-child(2) { border-top: 0; }
  /* Sessió 39 (Fàrmacs) */
  .sith2row { margin-top: 12px; }
  .sith2row .sith2 { margin: 0; }
  .nav .btn { font-size: 15px; padding-inline: 10px; }
}

/* ---------- Sessió 40 ---------- */
/* Selector (sexe…) i camp numèric: mateixa alçada, vora i radi (decisió 115) */
.num { height: 46px; box-sizing: border-box; align-items: center; border-radius: 10px; }
.seg:not(.sm):not(.wrap) { height: 46px; box-sizing: border-box; }
.seg:not(.sm) label { display: flex; }
.seg:not(.sm) span { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding-block: 0; }
/* ⓘ: es queda al seu lloc en obrir-se; el text surt en una targeta flotant sota la fila (cap salt de la pantalla) */
.h2row, .leadrow, .cond-h, .needrow { position: relative; }
.h2row details.ii[open], .leadrow > details.ii[open], .cond-h details.ii[open] { display: inline-block; flex: 0 0 auto; margin: 0; }
.needrow details.ii[open] { display: inline-block; flex: 0 0 auto; margin: 0 0 0 6px; }
.h2row details.ii[open] > summary, .leadrow > details.ii[open] > summary, .cond-h details.ii[open] > summary, .needrow details.ii[open] > summary { background: var(--soft); }
.h2row details.ii[open] > p, .leadrow > details.ii[open] > p, .cond-h details.ii[open] > p, .needrow details.ii[open] > p { position: absolute; left: 0; right: 0; top: 100%; z-index: 40; margin: 4px 0 0; padding: 10px 12px; background: #fff; border: 1.5px solid var(--accent); border-radius: 10px; box-shadow: 0 10px 28px rgba(14, 48, 60, .22); max-height: 62vh; overflow-y: auto; font-size: 14px; line-height: 1.4; }
.h2row details.ii.up > p, .leadrow > details.ii.up > p, .cond-h details.ii.up > p, .needrow details.ii.up > p { top: auto; bottom: 100%; margin: 0 0 4px; }

/* ===== Sessió 41: camp d'Agatston (CAC) dins de la targeta Modificadors ===== */
/* `.country input[type=text]` (camps de text de les targetes plegables) guanyava a `.num input`: el camp numèric del CAC tenia doble vora. */
.country .num input[type=text] { flex: 1 1 0; width: 0; min-width: 0; border: 0; border-radius: 0; background: none; padding: 10px 0; min-height: 0; box-shadow: none; outline: none; text-align: right; font-size: 18px; }
.country .num input[type=text]:focus { border: 0; box-shadow: none; outline: none; }
.cacnum { max-width: 200px; width: 100%; box-sizing: border-box; }
@media (max-width: 899px) { .country .num input[type=text] { padding: 8px 0; } }

/* ===== Sessió 42 ===== */
/* Calculador de percentil de CAC (MESA): només el llindar P75 verificat */
.mesa { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.mesa .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
.mesa select { min-height: 40px; border: 1.5px solid #C9D5D8; border-radius: 10px; padding: 0 10px; background: #fff; font: inherit; }
.mesa .hint { margin: 4px 0; }
.mesa .mesa-v { font-weight: 650; }
.mesa .mesa-v.up { color: #8A2B14; }
.mesa .mesa-v.dn { color: #1D6B3A; }

/* Resultat en viu a LDL: targeta d'espera a PC (punt 282) */
.lc-wait .dl-parts { grid-template-columns: 1fr; }
.lc-wait .dl-parts li { gap: 10px; }
.lc-wait .dl-parts li small { flex: 1; text-align: right; }

/* Densitat «Còmoda» (mòbil): més espai i alçada de controls; mai la mida de la lletra (decisió 125) */
@media (max-width: 899px) {
  html.dens-c main { padding: 16px 18px 24px; }
  html.dens-c .sec { padding: 14px 0; }
  html.dens-c .fld { margin-bottom: 14px; }
  html.dens-c .card .fld { margin-bottom: 12px; }
  html.dens-c .card { padding: 14px 14px 4px; margin: 14px 0 0; }
  html.dens-c .num { height: 50px; }
  html.dens-c .seg:not(.sm):not(.wrap) { height: 50px; }
  html.dens-c .seg span { padding: 12px 8px; min-height: 48px; }
  html.dens-c .cond-h > .chk { padding: 12px 0; }
  html.dens-c .tabs button { min-height: 58px; }
  html.dens-c .rx { padding: 10px 12px; }
  html.dens-c .tierd > summary, html.dens-c .grpd > summary { min-height: 50px; padding-block: 11px; }
  html.dens-c .dl-parts li { padding: 8px 0; }
}

/* Teràpia a PC, entrada directa: la targeta del risc en una sola fila compacta (punt 283) */
@media (min-width: 900px) {
  .tx-top .card.dir { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 24px; padding: 10px 14px; margin: 0 0 10px; }
  .tx-top .card.dir > h3 { margin: 0; flex: 0 0 auto; }
  .tx-top .card.dir > .fld { margin: 0; flex: 1 1 440px; max-width: 580px; }
  .tx-top .card.dir > .fld .lab { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .tx-top .card.dir .seg.wrap { flex-wrap: nowrap; }
  .tx-top .card.dir .seg.wrap label { flex: 1 1 0; }
  .tx-top .card.dir .seg.wrap label span { border-top: 0 !important; }
  .tx-top .card.dir .seg.wrap label:nth-child(odd) span { border-left: 1.5px solid #C9D5D8; }
  .tx-top .card.dir .seg.wrap label:first-child span { border-left: 0; }
  .tx-top .card.dir > .cond { margin: 0; padding: 0; border-top: 0; flex: 0 1 auto; }
  .tx-top .card.dir > .cond:last-of-type { padding-bottom: 0; }
  .tx-top .card.dir .chk .d { display: none; }
  .tx-top .card.dir > p.hint { font-size: 12.5px; }
  .tx-top .card.dir > #dir-check, .tx-top .card.dir > p.hint { flex: 1 1 100%; margin: 0; }
  .tx-top .card.dir > #dir-check:empty { display: none; }
}

/* Sessió 44 (decisió 137): variables del càlcul MESA juntes a la targeta CAC (sexe, edat, grup) */
.mesa-vars { margin: 6px 0 10px; }
.mesa-vars .fpair { margin-bottom: 8px; }
.mesa-vars select { width: 100%; min-height: 46px; border: 1.5px solid #C9D5D8; border-radius: 10px; padding: 0 10px; background: #fff; font: inherit; }
.mesa-vars .lab { display: block; margin-bottom: 4px; }

/* Sessió 44 (decisió 139): capçalera de la targeta CAC amb ⓘ; el text d'ajuda buit no ocupa lloc */
.h3row { margin-bottom: 4px; }
.h3row h3 { margin: 0; }
#cac-hint:empty { display: none; }

/* ---------- Sessió 45: Pacient i Dades (decisions 142–149) ---------- */
.nav .msg.miss { color: #9A2F2F; font-weight: 700; }
.csum { min-width: 0; }
.csum b { font-weight: 650; }
.csub { font-weight: 400; font-size: 12.5px; color: var(--mute); }
@media (max-width: 899px) {
  details.country { margin-top: 0; }
  details.country summary { padding: 9px 0; font-size: 14.5px; }
  .sec { padding: 6px 0; }
  .sec:first-of-type { padding-top: 2px; }
  .fld { margin-bottom: 6px; }
  .fld > label, .lab { margin-bottom: 2px; }
  .note { padding: 7px 12px; margin: 6px 0 0; }
  main { padding-top: 8px; padding-bottom: 8px; }
  .h2row { margin-bottom: 4px; }
  .top { padding-top: calc(8px + env(safe-area-inset-top)); }
  .steps { margin-top: 8px; }
  .nav { padding-top: 7px; padding-bottom: 7px; }
  .fld > label, .lab { line-height: 1.2; }
  /* Decisió 149: a mòbil, «Categoria a priori» ja implica que no es calcula SCORE2 */
  .note .noscore { display: none; }
}

/* ---------- Sessió 45: Modificadors i Resultat (decisions 150–151) ---------- */
.pvars { display: flex; flex-wrap: wrap; gap: 5px 6px; margin: 0 0 8px; padding: 0; list-style: none; }
.pvars li { font-size: 12.5px; line-height: 1.2; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink2); white-space: nowrap; }
.pvars li.mdl { background: var(--soft); border-color: #BCD5DC; color: var(--accent-d); font-weight: 600; }
.eff { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 12px; margin: 0 0 8px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.eff .lab { display: block; font-size: 12.5px; color: var(--mute); margin: 0 0 3px; }
.eff .effv { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; font-size: 15px; }
.eff .arr { color: var(--mute); font-size: 18px; }
.effh { margin: 0 0 8px; }
details.mg { margin: 0 0 8px; }
.purelab { font-size: 13px; color: var(--ink2); }
@media (max-width: 899px) {
  .pvars { gap: 4px 5px; margin-bottom: 6px; }
  .pvars li { font-size: 12px; padding: 3px 8px; }
  .eff { grid-template-columns: 1fr auto 1fr; padding: 8px 12px; }
  .goalsec.nocat .kv > div:nth-child(1) { grid-column: 1 / -1; padding-bottom: 2px; }
  .goalsec.nocat .kv > div:nth-child(2) { grid-column: 1 / -1; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 10px; }
  .goalsec.nocat .kv > div:nth-child(2) dd { display: contents; }
  .goalsec.nocat .kv > div:nth-child(2) dd small { grid-column: 1 / -1; }
  .goalsec .kv > div:nth-child(3) { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 10px; }
  .goalsec .kv > div:nth-child(3) dd { display: contents; }
  .goalsec .kv > div:nth-child(3) dd small { grid-column: 1 / -1; }
  #cac-res { display: none; }
  .res-adj-h, #res-adj .sec > h3 { font-size: 15px; margin-bottom: 2px; }
  #res-adj .trace { margin-top: 4px; font-size: 13.5px; }
}

/* Sessió 45 (decisions 152–153): bloc «pur → amb ajustos», etiquetes de canvi, xips d'ètnia, llegenda plana, separació de targetes */
.effwrap { margin: 0 0 10px; }
.eff { margin-bottom: 6px; }
.eff .effv { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 2px 7px; }
.eff .effp { font-family: var(--num); font-size: 24px; font-weight: 600; line-height: 1.05; font-variant-numeric: lining-nums; }
.dtags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
.dtag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 650; border: 1.5px solid transparent; }
.dtag.none { background: #EEF2F3; color: var(--ink2); border-color: #D5DEE0; }
.dtag.pct { background: #E2EEF1; color: var(--accent-d); border-color: #BCD5DC; }
.dtag.cat1 { background: #FBE8CC; color: #7A4300; border-color: #E6B96B; }
.dtag.cat2 { background: #F7D9D9; color: #7A1F22; border-color: #E3A3A4; }
.dtag.down { background: #DDF0E7; color: #1D5E43; border-color: #9CCDB6; }
.effwrap .trace { margin: 2px 0 0; font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
.chipb { flex: 0 1 auto; min-height: 44px; padding: 8px 14px; border: 1.5px solid var(--ctl-line); border-radius: 999px; background: #fff; color: var(--ink); font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; text-align: left; }
.chipb b { font-weight: 700; color: var(--accent-d); margin-left: 3px; }
.chipb.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chipb.on b { color: #fff; }
.chipb:disabled { opacity: .5; cursor: not-allowed; }
.chipb:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 1px; }
.legend.flat .legh { font-size: 15px; margin: 4px 0 6px; }
#eth-wrap { margin: 0 0 10px; }
details.mg + #eth-wrap, #eth-wrap + details.mg { margin-top: 0; }

/* Sessió 45 (decisió 154): Lp(a) visual i files d'ètnia clicables */
.lpabar { width: 100%; height: auto; display: block; margin: 2px 0 6px; }
.lpa-s0 { fill: #E4E9EA; } .lpa-s1 { fill: #BFE3D0; } .lpa-s2 { fill: #F3CF8B; } .lpa-s3 { fill: #E8A3A3; }
.lpa-m { fill: var(--ink); } .lpa-t { font-size: 11px; fill: var(--mute); }
.lpacmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 6px; }
.lbox { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; display: flex; flex-direction: column; gap: 3px; }
.lbox.on { border-color: var(--accent); box-shadow: 0 0 0 2px #CFE4EA; background: #F3F9FA; }
.lbox:not(.on) { opacity: .72; }
.lbox .lbig { font-family: var(--num); font-size: 22px; font-weight: 600; line-height: 1.1; }
.lbox .lres { font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.dtag.apply { background: var(--accent); color: #fff; border-color: var(--accent); align-self: flex-start; font-size: 12px; padding: 2px 8px; }
table.ethtab tr[data-act="eth"] { cursor: pointer; }
table.ethtab tr[data-act="eth"] > * { padding-top: 11px; padding-bottom: 11px; }
@media (hover: hover) { table.ethtab tr[data-act="eth"]:hover { background: #F3F9FA; } }
table.ethtab tr[data-act="eth"].on > * { background: var(--soft); font-weight: 700; color: var(--accent-d); }
table.ethtab tr[data-act="eth"].on > th::before { content: "✓ "; }
table.ethtab tr[data-act="eth"]:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: -3px; }
table.ethtab tr[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }

/* Sessió 45 (Aleix, 19/11): objectiu de LDL i reducció necessària, dues targetes enganxades al mòbil; traça curta */
@media (max-width: 899px) {
  .goalsec.nocat .kv { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 8px; row-gap: 8px; }
  .goalsec.nocat .kv > div:nth-child(1), .goalsec.nocat .kv > div:nth-child(2) { display: block; grid-column: auto; margin: 0; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 9px; background: #fff; }
  .goalsec.nocat .kv > div:only-child { grid-column: 1 / -1; }
  .goalsec.nocat .kv > div:nth-child(2) dd { display: block; }
  .goalsec.nocat .kv dt { font-size: 12.5px; margin: 0 0 2px; }
  .goalsec.nocat .kv dd { font-size: 14px; font-weight: 650; }
  .goalsec.nocat .kv dd .big { font-size: 24px; line-height: 1.1; }
  .goalsec.nocat .kv dd small { display: block; font-size: 12px; font-weight: 400; margin-top: 1px; }
  #res-adj .trace { font-size: 13.5px; margin: 2px 0 6px; padding-left: 18px; }
  #res-adj .trace li { margin: 0 0 1px; }
}
@media (max-width: 899px) {
  #main h2.rs-h2 { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .effwrap { margin-bottom: 6px; }
  .effwrap .dtags { margin-bottom: 4px; }
}
@media (max-width: 899px) {
  .goalsec.nocat { border-top: 0; margin-top: 0; padding-top: 0; }
  .eff { padding: 7px 12px; }
  .effwrap .dtag { padding-top: 3px; padding-bottom: 3px; }
}
@media (max-width: 899px) {
  .rs-hero { grid-template-columns: minmax(0, 156px) minmax(0, 1fr); margin: 0 0 2px; }
  .rs-hero .gauge { max-width: 156px; }
  .pvars { margin-bottom: 2px; }
}

/* Sessió 45 (decisió 157): sub-pestanyes de Teràpia (mòbil): Objectiu · Tractament · Opcions, només tractament */
.txp[hidden] { display: none !important; }
.txsteps { list-style: none; display: flex; gap: 6px; margin: 2px 0 12px; padding: 0; }
.txsteps li { flex: 1; min-width: 0; }
.txsteps button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0 0 6px; cursor: pointer; font: inherit; color: inherit; }
.txsteps .bar { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-bottom: 6px; }
.txsteps .lbl { display: block; font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txsteps .cur .bar { background: var(--accent); height: 6px; margin-top: -1px; }
.txsteps .cur .lbl { color: var(--ink); font-weight: 650; }
.txsteps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (max-width: 899px) {
  #main h2.tx-h2 { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}

/* Sessió 45 (decisions 157–159): Teràpia mòbil, pestanyes planes (sense número ni caixa de color), Objectiu amb velocímetre, Tractament compacte */

.card.cur .ldlgrid :is(#ldlr-a, #base-wrap) .lg-l > details.ii.up > p { top: auto; bottom: 100%; margin: 0 0 4px; }

  .card.cur .ldlgrid :is(#ldlr-a, #base-wrap) .cursum .cs1, .card.cur .ldlgrid :is(#ldlr-a, #base-wrap) .cursum .cs2 { display: inline; }

/* S60 (comentaris d'Aleix, 23/11): targeta compacta (LDL esperat a la dreta de l'etiqueta; ⓘ a la dreta de l'última línia) i verd/vermell a l'ⓘ. */

<script>
/* Mòdul 1 — SCORE2 / SCORE2-OP + exclusions + modificadors + objectiu de LDL.

 * Regles clíniques: XULA 2022 (decisions d'Aleix, sessió 3 — vegeu Seguiment §5).
 * Sessió 10: MRC amb albuminúria A3 i FG ≥45 → «molt alt» (ESC 2026, Taula 7, p. 22), amb nota de font (punt 55, opció 2).
 * Sessió 11 (punt 69): límits d'albuminúria alineats amb les categories A1/A2/A3 (SEA 2026 Tabla 5; ESC 2026 Taula 7):
 *   A1 <30, A2 30–300 (ambdós inclosos), A3 >300 mg/g. Un ACR de 30 mg/g ja és albuminúria (A2); un de 300 mg/g encara és A2. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./score2_params.js'));
  else root.SCORE2 = factory(root.SCORE2Params);

  'use strict';

  /* ---------- Utilitats ---------- */
  function toMmol(value, units, factor) {
    return units === 'mmol' ? value : value / (factor || P.MGDL_PER_MMOL_CHOL);
  }
  function round(x, d) { var m = Math.pow(10, d); return Math.round(x * m) / m; }
  function checkNum(name, v, lo, hi) {
    if (typeof v !== 'number' || !isFinite(v)) throw new Error('Valor no numèric: ' + name);

  }
  function sexKey(sex) {
    if (sex === 'M' || sex === 'F') return sex;
    throw new Error("Sexe ha de ser 'M' o 'F'");
  }

  /* Recalibratge (mateix a totes les famílies): 1 − exp(−exp(s1 + s2·ln(−ln(1−r)))) */
  function recalibrate(uncal, s1, s2) {
    return 1 - Math.exp(-Math.exp(s1 + s2 * Math.log(-Math.log(1 - uncal))));
  }

  /* ---------- SCORE2 (40–69) ---------- */
  function score2(inp) {
    var sx = sexKey(inp.sex), c = P.SCORE2[sx];
    var region = inp.region || 'low', units = inp.units || 'mgdl', f = inp.mgdlFactor;
    checkNum('edat', inp.age, 40, 69);
    checkNum('PAS', inp.sbp, 60, 300);
    var tc = toMmol(inp.tc, units, f), hdl = toMmol(inp.hdl, units, f);
    checkNum('colesterol total (mmol/L)', tc, 1, 20);
    checkNum('HDL (mmol/L)', hdl, 0.2, 5);
    var s = inp.smoker ? 1 : 0, d = inp.diabetes ? 1 : 0;
    var cage = (inp.age - 60) / 5, csbp = (inp.sbp - 120) / 20, ctc = tc - 6, chdl = (hdl - 1.3) / 0.5;
    var lp = c.age * cage + c.smoke * s + c.sbp * csbp + c.tchol * ctc + c.hdl * chdl + c.diab * d

           + c.hdlAge * chdl * cage + c.diabAge * d * cage;
    var uncal = 1 - Math.pow(c.S0, Math.exp(lp));
    var family = inp.family || 'SCORE2';          // 'SCORE2' (Europa) | 'LAC' | 'AP' — mateixos coeficients, escales diferents

    molt_alt:     { ldl: 55,  minReduction: 0.5, ref: 'XULA Taula 1' },

      notes.push('Discrepància entre guies: l\'ESC/EAS 2019 (Tabla 4, p. 403.e14) classifica la DM1 de debut precoç i llarga durada (>20 anys) com a molt alt risc (l\'ESC no defineix «precoç»; la XULA hi usa <10 anys); el §5.3.2 de la XULA la deixa en «alt» si no hi ha complicacions ni ≥3 FRCV. S\'aplica la XULA; valoreu pujar a molt alt amb criteri clínic.');

  /* ---------- Flux complet ---------- */

  /* ---------- Punt 84: reducció d'LDL per estatina i dosi (VISTA DE COMPARACIÓ; el model per defecte continua per classe) ----------
   * Decisió D6/D7 (proposta, sessió 15: Aleix no ha respost D6–D8 i s'apliquen els valors recomanats):
   *   - el mode per CLASSE (SEA 2026 / XULA 2022) continua sent el de les propostes;
   *   - el mode per DOSI és una segona vista: no canvia mai les pautes, només compara i avisa si difereix de més de 5 punts.
   * Font única: Law MR, Wald NJ, Rudnicka AR. BMJ 2003;326:1423, Taula 2 (PMID 12829554, doi 10.1136/bmj.326.7404.1423);
   * pitavastatina: Cochrane, Adams SP et al. 2020, CD012735.pub2 (PMID 32557581): 1 mg −33,2 %; 2 mg −38,6 % (corba log-dosi); 4 mg −44,0 %.
   * Nivell de verificació: valors de la Taula 2 llegits a la sessió 14; el resum de PubMed (06/11/2026) confirma atorvastatina 80 = 55 %
   * i rosuvastatina 80 = 60 % (el resum arrodoneix a 40 % atorvastatina 10, lovastatina 40, simvastatina 40 i rosuvastatina 5: a la Taula 2 són 37, 37, 37 i 38). */
  var STATIN_DOSE_EFF = {
    atorvastatin: { 10: 37, 20: 43, 40: 49, 80: 55 },
    rosuvastatin: { 5: 38, 10: 43, 20: 48, 40: 53 },
    simvastatin:  { 10: 27, 20: 32, 40: 37 },
    pravastatin:  { 10: 20, 20: 24, 40: 29 },
    lovastatin:   { 10: 21, 20: 29, 40: 37 },
    fluvastatin:  { 40: 27, 80: 33 },
    pitavastatin: { 1: 33.2, 2: 38.6, 4: 44.0 }

    law: 'Law MR, Wald NJ, Rudnicka AR. BMJ 2003;326:1423, Taula 2 (PMID 12829554)',
    pitavastatin: 'Cochrane, Adams SP et al. 2020, CD012735.pub2 (PMID 32557581)'
  };

    'Mitjana poblacional de metaanàlisi, no la resposta individual: a VOYAGER (Karlson 2016, PMID 27533947) la desviació estàndard individual és de 12,8–17,9 punts i entre el 5,3 i el 53,3 % dels pacients no arriben al 30 % de reducció segons la dosi (xifres de la sessió 14, no tornades a llegir).',
    'A dosis altes d\'atorvastatina i rosuvastatina l\'efecte pot ser menor que a Law 2003 (Naci 2013, Eur J Prev Cardiol 20:658–670; valor no extret).',
    'STELLAR (Jones 2003, PMID 12860216, resum): rosuvastatina 10–80 mg redueix l\'LDL de mitjana 8,2 punts més que atorvastatina 10–80, 26 més que pravastatina 10–40 i 12–18 més que simvastatina 10–80; les xifres per dosi no s\'han extret.'
  ];
  function statinDoseEff(drug, dose) {
    statinById(drug);
    var t = STATIN_DOSE_EFF[drug], d = +dose;
    if (!t || t[d] == null) throw new Error('Dosi sense dada de reducció a Law 2003/Cochrane per a ' + drug + ': ' + dose);
    return { e: t[d], drug: drug, dose: d, cite: drug === 'pitavastatin' ? STATIN_DOSE_CITE.pitavastatin : STATIN_DOSE_CITE.law,
      level: drug === 'pitavastatin' ? 'Resum (Cochrane)' : 'Taula (Law 2003, Taula 2)' };
  }
  var DOSE_DIFF_POINTS = 5;
  /* R amb l'estatina substituïda per la reducció per dosi; la resta de components, com al mode per classe. */
  function combineWithStatinE(spec, scale, statinE) {
    var s = normSpec(spec), c = combine(s, scale), prod = 1;
    c.parts.forEach(function (x) {
      var e = (x.key.indexOf('statin_') === 0 && statinE != null) ? statinE : x.e;

  }
  /* Igual que combine(), però la part d'estatina porta la reducció per dosi (eff = {e, cite}); la resta, com al mode per classe. */
  function combineE(spec, scale, eff) {
    var c = combine(spec, scale);
    c.parts = c.parts.map(function (x) {
      return x.key.indexOf('statin_') === 0 ? { key: x.key, e: eff.e, source: x.source, fallback: false, perDose: true, eClass: x.e, cite: eff.cite } : x;
    });

  }
  /* Opcions (fàrmac + dosi) d'una pauta amb estatina en mode per dosi. Es descarten les més febles que l'estatina actual
   * (no seria una intensificació); si strict (pujar la dosi), només les estrictament més fortes. Cada opció duu la seva R i si arriba. */
  function doseOptions(c, scale, curDrug, curDD, curEff, strict, goal, baseline, need, eps) {
    var so = statinOptions(c.statin, scale, curDrug), list = [], eCls = null;
    combine(c, scale).parts.forEach(function (x) { if (x.key.indexOf('statin_') === 0) eCls = x.e; });
    so.all.forEach(function (ent) {
      ent.doses.forEach(function (d) {
        var ef = statinDoseEff(ent.id, d);
        list.push({ drug: ent.id, name: ent.name, dose: d, text: ent.name + ' ' + d + ' mg', e: ef.e, eClass: eCls, classE: ef.e - eCls, cite: ef.cite, level: ef.level,

    list.forEach(function (o) {

      o.R = R; o.Rpct = round(R * 100, 1); o.expectedLdl = round(baseline * (1 - R), 0); o.maxBaselineLdl = round(maxBaselineLdl(R, goal), 0);
      o.reaches = R >= need - eps; o.differsFromClass = Math.abs(o.e - eCls) > DOSE_DIFF_POINTS;
    });
    list.sort(function (a, b) { if (a.isCurrent !== b.isCurrent) return a.isCurrent ? -1 : 1; if (a.e !== b.e) return a.e - b.e; return a.text < b.text ? -1 : 1; });

  }
  function currentDrugDose(p) {
    var c = (p && p.current) || {};
    if (c.statinDrug && c.statinDrug !== 'none' && c.statinDose != null && c.statinDose !== '') return { drug: c.statinDrug, dose: +c.statinDose };
    return null;
  }
  /* Vista per dosi del tractament actual i de cada pauta amb estatina. mode 'dose' mai no modifica res de main. */
  function doseView(p, scale, main, asMain) {
    var dd = currentDrugDose(p);
    if (!dd) return { available: false, reason: 'Cal triar fàrmac i dosi de l\'estatina actual per veure la comparació per dosi.' };
    var eff = statinDoseEff(dd.drug, dd.dose);
    var curIn = curForScale(p.current, scale), cur = normSpec(curIn);
    var Rclass = combine(cur, scale).R, Rdose = combineWithStatinE(cur, scale, eff.e);
    var eClass = null;
    combine(cur, scale).parts.forEach(function (x) { if (x.key.indexOf('statin_') === 0) eClass = x.e; });
    var goal = p.goal && p.goal.ldlGoal, floor = (p.goal && p.goal.minReduction) || 0;
    var baselineKnown = typeof p.baselineLdl === 'number' && p.baselineLdl > 0;
    var bClass = baselineKnown ? p.baselineLdl : (Rclass > 0 ? p.ldl / (1 - Rclass) : p.ldl);
    var bDose = baselineKnown ? p.baselineLdl : (Rdose > 0 ? p.ldl / (1 - Rdose) : p.ldl);
    var needClass = goal ? Math.max(0, (bClass - goal) / bClass, floor) : null;
    var needDose = goal ? Math.max(0, (bDose - goal) / bDose, floor) : null;

      if (asMain) flags.push('VALOR PER DOSI: «' + describeStatin(dd.drug, dd.dose) + '» redueix ' + eff.e + ' % segons ' + eff.cite + '; com a estatina d\'intensitat ' + CLASS_CA[curIn.statin] + ' el model per classe (' + SOURCES[scale].label + ') en donaria ' + eClass + ' %. Amb la resta del tractament actual la reducció total és ' + round(Rdose * 100, 1) + ' % per dosi (valor principal) i ' + round(Rclass * 100, 1) + ' % per classe (' + (diffPts > 0 ? '+' : '') + diffPts + ' punts).');
      else flags.push('DISCREPÀNCIA CLASSE/DOSI: «' + describeStatin(dd.drug, dd.dose) + '» redueix ' + eff.e + ' % segons ' + eff.cite + ' i ' + eClass + ' % com a estatina d\'intensitat ' + CLASS_CA[curIn.statin] + ' (' + SOURCES[scale].label + '); amb la resta del tractament actual la reducció total és ' + round(Rdose * 100, 1) + ' % per dosi i ' + round(Rclass * 100, 1) + ' % per classe (' + (diffPts > 0 ? '+' : '') + diffPts + ' punts). Les propostes mantenen el mode per classe.');
    }

    if (!asMain && main && main.status === 'cal_intensificar') {
      var all = (main.proposals || []).concat(main.near || []);

        rows.push({ label: r.label, classKey: r.classKey, drug: ent.id, drugName: ent.name, doses: ent.doses.slice(),

        return item(key, 0, 'Sense ajust de dosi en insuficiència renal (fitxa tècnica, §4.2).', c);
      case 'alirocumab':
        if (e < 30) return item(key, 1, 'Dades limitades en insuficiència renal greu: precaució.', c,
          e < 20 ? ESC_SRC + ' (§7.1.2.2, p. 48): amb FG <20 l\'evidència és insuficient per recomanar un anti-PCSK9.' : null);
        return item(key, 0, 'Sense ajust en insuficiència renal lleu o moderada.', c);
      case 'inclisiran':
        if (e < 15) return item(key, 1, 'Sense ajust de dosi, també en malaltia renal terminal; experiència limitada. En hemodiàlisi, no dialitzar fins ≥72 h després de la dosi.', c);
        if (e < 30) return item(key, 1, 'Sense ajust de dosi; experiència limitada en insuficiència renal greu: precaució.', c);
        return item(key, 0, 'Sense ajust de dosi en insuficiència renal.', c);
      case 'fenofibrat':
        if (e < 30) return item(key, 3, 'FG <30 mL/min/1,73 m²: contraindicat. La XULA 2022 també en desaconsella l’ús en els graus 4 i 5 de la MRC.', c);
        if (e < 60) return item(key, 2, 'FG 30–59: la dosi no ha de superar 100 mg estàndard o 67 mg micronitzat una vegada al dia. Les combinacions fixes amb estatina estan contraindicades amb CrCl <60. Mesurar la creatinina durant els 3 primers mesos i després periòdicament, i suspendre’l si puja >50 % per sobre del límit superior de la normalitat.', c);
        if (e < 90) return item(key, 1, 'FG 60–89: usar-lo amb precaució. Mesurar la creatinina durant els 3 primers mesos i després periòdicament; el risc de toxicitat muscular augmenta amb la insuficiència renal, la hipoalbuminèmia i l’estatina concomitant.', c);
        return item(key, 0, 'Sense ajust de dosi. Mesurar la creatinina durant els 3 primers mesos i després periòdicament; si la funció renal cau a FG <30, s’ha de suspendre.', c);
      case 'bezafibrat':
        /* Les fitxes de les marques no coincideixen: Eulitop 200 mg té una pauta per trams; Eulitop Retard 400 mg és contraindicat amb aclariment <60;
         * Difaterol Retard 400 mg només diu «valorar amb cura» per <60 i contraindica <15. La fitxa parla d'aclariment de creatinina (CrCl). */
        if (e < 15) return item(key, 3, 'FG <15 mL/min: contraindicat (també en diàlisi i en síndrome nefròtica).', c);
        if (e < 40) return item(key, 2, 'Aclariment 40–15 mL/min: comprimits de 200 mg, 1 comprimit cada 1 o 2 dies (Eulitop 200 mg). La forma retard de 400 mg no és utilitzable (Eulitop Retard la contraindica amb <60).', c);
        if (e <= 60) return item(key, 2, 'Aclariment 60–40 mL/min: comprimits de 200 mg, 1 comprimit 2 cops al dia (Eulitop 200 mg). Forma retard de 400 mg: contraindicada a Eulitop Retard amb <60; Difaterol Retard només diu «valorar amb cura» (<60). Les fitxes de les marques no coincideixen.', c);
        return item(key, 0, 'Sense ajust de dosi amb aclariment >60 mL/min (200 mg 3 cops al dia o 400 mg retard 1 cop al dia). Risc de rabdomiòlisi més alt amb insuficiència renal i hipoalbuminèmia.', c);
      case 'gemfibrozil':
        if (e < 30) return item(key, 3, 'FG <30: contraindicat en insuficiència renal greu (la fitxa no en fixa el límit numèric; s’usa FG <30 com a aproximació).', c);
        if (e < 50) return item(key, 2, 'Insuficiència renal moderada (FG 30–<50): començar amb 900 mg/dia i valorar la funció renal abans de pujar la dosi.', c);
        if (e <= 80) return item(key, 1, 'Insuficiència renal lleu (FG 50–80): començar amb 900 mg/dia i valorar la funció renal abans de pujar la dosi.', c);
        return item(key, 0, 'Sense ajust de dosi amb FG >80.', c);
      case 'icosapent':
        return item(key, 0, 'Sense ajust de dosi en insuficiència renal ni hepàtica (fitxa tècnica EMA).', c);
    }
    return null;
  }

  // items: [{drug:'rosuvastatina', mg:20}, {drug:'Ezetimiba'}, ...]; retorna llista (sense duplicats) o [] si no hi ha FG.
  function check(egfr, items) {
    var band = egfrBand(egfr);
    if (!band) return [];
    var seen = {}, out = [];
    (items || []).forEach(function (it) {
      if (!it) return;
      var k = drugKey(it.drug);
      if (!k || seen[k]) return;
      seen[k] = true;
      var r = checkOne(k, it.mg, band.egfr);
      if (r) out.push(r);
    });
    return out;
  }

  function worst(list) {
    var w = 0;
    (list || []).forEach(function (r) { if (r.level !== null && r.level > w) w = r.level; });
    return w;
  }

  var NOTE = 'Les fitxes tècniques es refereixen a l\'aclariment de creatinina (CrCl); aquí s\'usa el FG estimat com a aproximació. Informatiu: revisar la fitxa tècnica abans de prescriure. Verificat a CIMA/EMA el ' + CHECKED + '. Les combinacions a dosi fixa no es modelen i tenen restriccions pròpies a la fitxa (p. ex. rosuvastatina/ezetimiba 30/10 i 40/10 contraindicades amb CrCl <60; ezetimiba/simvastatina: dosis recomanades 10/20 mg amb FG <60; pitavastatina/ezetimiba 4/10 no recomanada en insuficiència renal greu; fenofibrat/pravastatina contraindicat amb CrCl <60): revisar la fitxa.';

  /* Finançament dels iPCSK9 (evolocumab, alirocumab, inclisiran).
   * ctx: {mcv, hfhe, hofh, statinIntolerant, ldl (mg/dL amb la dosi màxima tolerada d'estatina ± ezetimiba)}
   * Criteri (BIFIMED, octubre 2026, consultat 24/10/2026): LDL-C >100 mg/dL amb la dosi màxima tolerada d'estatina
   * (sola o amb ezetimiba) en malaltia CV establerta, HFHe o HFHo.
   * Punt 99 (resolt el 10/11/2026 amb els acords CFT-SISCAT d'alirocumab i evolocumab, v2 22/07/2019, i d'inclisiran, 11/07/2024):
   * la intolerància/contraindicació a estatines NO és una via independent. Només canvia la definició de «teràpia hipolipemiant òptima»
   * (dosi màxima tolerada o cap estatina); el pacient ha de pertànyer igualment a un grup de la taula (HFHe, o prevenció secundària amb
   * malaltia CV; per a l'HFHo, evolocumab). L'acord d'inclisiran ho diu explícitament: la intolerància s'aplica «a qualsevol dels pacients dels grups anteriors».
   * Per tant, intolerància sense MCV/HFHe/HFHo = «no».
   * Decisions d'Aleix (10/11/2026): (1) opció (b): l'etiqueta diu «criteri nacional (BIFIMED)» i avisa que a Catalunya cal el llindar de l'acord per grup
   * de risc (no es modela); (2) HFHo: s'aplica LDL-C >100 mg/dL (criteri de la financiació catalana), tot i que l'annex d'evolocumab no fixa llindar. */
  function pcsk9Funding(ctx) {
    ctx = ctx || {};
    var ldl = Number(ctx.ldl);
    var hasLdl = isFinite(ldl) && ldl > 0;
    var clinical = !!(ctx.mcv || ctx.hfhe || ctx.hofh);
    var intol = !!ctx.statinIntolerant;
    var lines = [];
    var base = 'Font: BIFIMED (octubre 2026) i CatSalut PHF, consultades el ' + FUNDING_DATE + '. Cal validar els criteris clínics pel circuit de CatSalut i tornar a consultar-ho abans de prescriure.';
    var status, title;
    if (!hasLdl) {
      status = 'incomplet';
      title = 'Falta el LDL-C per valorar el finançament';
      lines.push('Cal el LDL-C amb la dosi màxima tolerada d\'estatina (± ezetimiba).');
    } else if (ldl <= 100) {
      status = 'no';
      title = 'No es compleix el criteri de LDL-C';
      lines.push('El finançament exigeix LDL-C >100 mg/dL (ara: ' + Math.round(ldl) + ' mg/dL).');
    } else if (clinical) {
      status = 'compleix';
      title = 'Es compleix el criteri nacional (BIFIMED)';
      lines.push('LDL-C >100 mg/dL' + (intol ? ' amb intolerància/contraindicació a estatines' : ' amb la dosi màxima tolerada d\'estatina') + ' i ' + (ctx.mcv ? 'malaltia CV establerta' : ctx.hofh ? 'HFHo' : 'HFHe') + '.');
      lines.push('A Catalunya, l\'acord CFT-SISCAT exigeix a més que el LDL-C superi el llindar del seu grup de risc (>100, >130 o >160 mg/dL; vegeu la taula de l\'acord, a sota). Aquest càlcul no el comprova: cal fer-ho amb el grup del pacient.');
    } else {
      status = 'no';
      title = 'No es compleix el criteri clínic';
      lines.push('Cal malaltia CV establerta, HFHe o HFHo.');
      if (intol) lines.push('La intolerància o contraindicació a estatines no és per si sola una via de finançament: només canvia què es considera tractament hipolipemiant òptim (dosi màxima tolerada o cap estatina). Els acords CFT-SISCAT d\'alirocumab i evolocumab (v2, 2019) i d\'inclisiran (2024) la fan servir només dins dels grups d\'HFHe o de prevenció secundària.');
    }
    return { status: status, title: title, lines: lines, note: base, date: FUNDING_DATE };
  }

  return {
    LEVELS: LEVELS, NOTE: NOTE, CHECKED: CHECKED, FUNDING_DATE: FUNDING_DATE,
    drugKey: drugKey, egfrBand: egfrBand, check: check, worst: worst, pcsk9Funding: pcsk9Funding
  };
});
